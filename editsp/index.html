<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Modifier ma page · Waslux</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f1b16;--mut:#7a7061;--line:#e3dac8;--ac:#b8893b;--ok:#2f7d4f;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;line-height:1.5}
.w{max-width:640px;margin:0 auto;padding:14px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;margin:8px 0 2px}.sub{color:var(--mut);font-size:14px;margin:0 0 6px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.c h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 0}
input,textarea{width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea{min-height:80px}
.ltr{direction:ltr;text-align:left}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.s{padding:8px 11px;font-size:14px}
button.d{background:#fff;color:var(--bad);border:1px solid var(--line)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#fff}
.item.off{opacity:.55}
.r2{display:grid;grid-template-columns:1fr 110px;gap:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sw{display:flex;align-items:center;gap:6px;font-weight:600;margin:0}
.sw input{width:auto;margin:0}
.cat{display:flex;gap:8px;align-items:center;margin-top:14px}
.cat input{font-weight:700}
.hr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}
.hr input{margin:0}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}
.bar button{flex:1;max-width:320px}
#msg{font-size:14px;min-height:20px;text-align:center;margin:4px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
details.c>summary{font-size:16px;font-weight:700;color:var(--ac);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:30px}
details.c>summary::-webkit-details-marker{display:none}
details.c>summary::after{content:"▾";font-size:14px}details.c[open]>summary::after{content:"▴"}
details.c[open]>summary{margin-bottom:8px}
.th{width:64px;height:64px;border-radius:12px;border:1px dashed var(--line);background:#fff center/cover no-repeat;flex:none;padding:0;color:var(--mut);font-size:12px;font-weight:600}
.row{display:flex;gap:10px;align-items:flex-start}.row>.f{flex:1;min-width:0}
.r3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.chk label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}.chk input{width:auto;margin:0}
.hint{font-size:13px;color:var(--mut);margin:4px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
 <div class="top"><div><h1 id="t_title"></h1><p class="sub" id="t_sub"></p></div><button class="g s" id="lang" type="button">العربية</button></div>
 <div id="err" class="c bad" hidden></div>
 <div id="app" hidden>
  <details class="c"><summary id="t_info"></summary><div id="info"></div></details>
  <details class="c"><summary id="t_hours"></summary><div id="hours"></div><div class="tools"><button class="g s" id="addh" type="button"></button></div></details>
  <details class="c" hidden><summary id="t_daily"></summary><p class="hint" id="t_daily_h"></p><div id="daily"></div></details>
  <details class="c" open><summary id="t_menu"></summary><p class="hint" id="t_menu_h"></p><div id="menu"></div><div class="tools"><button class="g s" id="addc" type="button"></button></div></details>
  <details class="c" hidden><summary id="t_staff"></summary><p class="hint" id="t_staff_h"></p><div id="staff"></div><div class="tools"><button class="g s" id="adds" type="button"></button></div>
   <h2 style="margin-top:16px" id="t_halls"></h2><p class="hint" id="t_halls_h"></p><div id="halls"></div><div class="tools"><button class="g s" id="addz" type="button"></button></div></details>
  <details class="c"><summary id="t_col"></summary><p class="hint" id="t_col_h"></p>
   <div class="r2" style="grid-template-columns:1fr 1fr"><label><span id="l_acc"></span><input type="color" id="cacc" data-col="accent" style="height:46px;padding:4px"><input id="caccx" data-colx="accent" maxlength="7" dir="ltr" placeholder="#RRGGBB"></label><label><span id="l_bg"></span><input type="color" id="cbg" data-col="bg" style="height:46px;padding:4px"><input id="cbgx" data-colx="bg" maxlength="7" dir="ltr" placeholder="#RRGGBB"></label></div>

   <p class="hint" id="cstat"></p><div class="tools"><button class="g s" id="crst" type="button"></button></div></details>
  <details class="c" id="dl"><summary id="t_loy"></summary><p class="hint" id="t_loy_h"></p>
   <label style="display:flex;gap:10px;align-items:center;margin:10px 0"><input type="checkbox" id="loyOn" data-loy="loyOn" style="width:22px;height:22px"><b id="l_loyon"></b></label>
   <select id="loyMode" data-loy="loyMode" style="width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px"><option value="code"></option><option value="tel"></option></select>
   <div class="r2" style="grid-template-columns:90px 1fr"><input type="number" id="loyN" data-loy="loyN" min="3" max="30" inputmode="numeric" dir="ltr"><input id="loyGift" data-loy="loyGift" maxlength="80"></div>
   <div class="item" style="text-align:center"><div class="hint" id="l_code"></div><div id="loycode" dir="ltr" style="font-size:38px;font-weight:800;letter-spacing:8px;margin-top:4px">····</div></div>
   <div class="item"><div class="hint" id="l_msg"></div><textarea id="loymsg" readonly rows="4" style="width:100%;margin-top:6px;padding:8px;border-radius:10px;border:1px solid var(--line);font:inherit;font-size:14px"></textarea><div class="tools"><button class="s" id="loycopy" type="button"></button></div></div>
   <div class="tools"><button class="g s" id="loyref" type="button"></button></div>
   <div id="loylist"></div></details>
  <div id="msg" role="status"></div>
 </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="bar" id="bar" hidden><button id="save" type="button"></button><button class="g" id="view" type="button"></button></div>
