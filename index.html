/* ظهور تدريجي عند التمرير */
const rv = document.querySelectorAll(".rv");
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .08 });
  rv.forEach(el => io.observe(el));
} else rv.forEach(el => el.classList.add("in"));

/* مشهد "كيف تعمل؟" بتبويبات */
const sc = document.getElementById("sc"), tabs = document.getElementById("tabs");
function setScene(k) {
  sc.innerHTML = SC[k]();
  tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.getAttribute("data-k") === k));
}
tabs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => setScene(b.getAttribute("data-k"))));

/* جرّب بنفسك */
const cu = document.getElementById("cust");
const tn = document.getElementById("tn"), tj = document.getElementById("tj"), tp = document.getElementById("tp");
let colorName = SITE.swatches[0][1];
function updTry() {
  const n = tn.value.trim(), j = tj.value.trim(), p = tp.value.trim();
  document.getElementById("pn").textContent = n || L.yourName;
  document.getElementById("pj").textContent = j || L.yourJob;
  document.getElementById("pa").textContent = n ? n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() : "؟";
  document.getElementById("pn").classList.toggle("ph0", !n);
  document.getElementById("pj").classList.toggle("ph0", !j);
  const parts = [];
  if (n) parts.push(SITE.tryName + ": " + n);
  if (j) parts.push(SITE.tryJob + ": " + j);
  if (p) parts.push(SITE.tryPhone + ": " + p);
  parts.push(SITE.tryColor + ": " + colorName);
  document.getElementById("tryorder").href = wa(SITE.orderMsg + SITE.tryProduct + " — " + parts.join("، "));
}
[tn, tj, tp].forEach(i => i.addEventListener("input", updTry));
cu.querySelectorAll(".sw button").forEach(b => b.addEventListener("click", () => {
  const t = TH[b.getAttribute("data-k")];
  ["accent", "g1", "g2", "ice", "glow", "c1", "c2", "ivory", "muted", "on"].forEach(v => cu.style.setProperty("--" + v, t[v]));
  cu.style.setProperty("--line", rgba(t.accent, .28));
  cu.style.setProperty("--iline", rgba(t.ice, .26));
  cu.querySelectorAll(".sw button").forEach(x => x.classList.toggle("on", x === b));
  colorName = SITE.swatches.filter(k => k[0] === b.getAttribute("data-k"))[0][1];
  updTry();
}));
updTry();

/* ساعدني أختار */
let showEx = () => {};
(function () {
  const fr = document.getElementById("exfr"), lst = document.getElementById("exl"), cats = document.querySelectorAll(".exb"), op = document.getElementById("exo");
  if (!fr) return;
  let cur = 0, loaded = false;
  const set = (id) => {
    const e = SITE.examples[id]; if (!e) return;
    fr.src = e.url; op.href = e.url; op.textContent = SITE.exOpen + " — " + e.name; loaded = true;
    lst.querySelectorAll(".exn").forEach(b => b.classList.toggle("on", b.getAttribute("data-id") === id));
  };
  const cat = (i, auto) => {
    cur = i; cats.forEach((b, k) => b.classList.toggle("on", k === i));
    const ids = SITE.exCats[i][1];
    lst.innerHTML = ids.map(id => '<button type="button" class="exn" data-id="' + id + '">' + esc(SITE.examples[id].name) + ' · ' + esc(SITE.examples[id].note) + '</button>').join("");
    lst.querySelectorAll(".exn").forEach(b => b.addEventListener("click", () => set(b.getAttribute("data-id"))));
    if (auto) { op.href = SITE.examples[ids[0]].url; op.textContent = SITE.exOpen + " — " + SITE.examples[ids[0]].name; lst.querySelector(".exn").classList.add("on"); }
    else set(ids[0]);
  };
  cats.forEach((b, i) => b.addEventListener("click", () => cat(i, false)));
  cat(0, true);
  // يحمّل الإطار فقط عند اقتراب القسم من الشاشة، لتوفير البيانات
  const sec = document.getElementById("examples");
  const go = () => { if (!loaded) set(SITE.exCats[cur][1][0]); };
  if ("IntersectionObserver" in window) { const io = new IntersectionObserver(en => { if (en[0].isIntersecting) { go(); io.disconnect(); } }, { rootMargin: "300px" }); io.observe(sec); } else go();
  showEx = (id) => {
    SITE.exCats.forEach((c, i) => { if (c[1].indexOf(id) > -1) { cat(i, true); } });
    set(id); sec.scrollIntoView({ behavior: "smooth", block: "start" });
  };
})();
(function () {
  const box = document.getElementById("hp");
  if (!box) return;
  let step = 0, ans = [];
  const pick = () => {
    const a = ans, items = [], note = [];
    const biz = a[0] !== 0, page = a[0] === 0 ? PK.me : (a[1] === 3 ? PK.menu : PK.biz), hold = a[0] === 0 ? PK.card : PK.stand;
    items.push([PK.mine, page + PK.on + hold]);
    if (a[1] === 1) items.push([PK.google, PK.googleD]);
    if (a[1] === 2) items.push([PK.plates, PK.platesD]);
    if (a[1] === 0 && biz) items.push([PK.cardItem, PK.cardD]);
    if (a[2] === 1) note.push(PK.multi);
    return { items, note, page, hold };
  };
  const draw = () => {
    if (step < SITE.help.length) {
      const q = SITE.help[step];
      box.innerHTML = '<div class="hs">' + (step + 1) + ' / ' + SITE.help.length + '</div><div class="hq">' + esc(q.q) + '</div><div class="oc">' + q.o.map((t, i) => '<button type="button" class="ob" data-i="' + i + '">' + esc(t) + '</button>').join("") + '</div>';
      box.querySelectorAll(".ob").forEach(b => b.addEventListener("click", () => { ans[step] = +b.getAttribute("data-i"); step++; draw(); }));
    } else {
      const r = pick();
      const msg = SITE.orderMsg + r.items.map(x => x[0]).join(" + ") + PK.nash + SITE.help[0].o[ans[0]] + PK.want + SITE.help[1].o[ans[1]] + PK.count + SITE.help[2].o[ans[2]];
      box.innerHTML = '<div class="hq">' + esc(SITE.helpSuggest) + '</div><ul>' + r.items.map(x => '<li><span><b>' + esc(x[0]) + '</b> — ' + esc(x[1]) + '</span></li>').join("") + '</ul>' + (r.note.length ? '<p class="hs">' + esc(r.note.join(" ")) + '</p>' : '') + '<div class="hb"><button type="button" class="btn" id="hex">' + esc(SITE.helpEx) + '</button><a class="btn cta" href="' + esc(wa(msg)) + '" target="_blank" rel="noopener">' + waIc + esc(SITE.helpOrder) + '</a><button type="button" class="btn" id="hagain">' + esc(SITE.helpAgain) + '</button></div>';
      document.getElementById("hex").addEventListener("click", () => showEx(ans[0] === 2 ? "waslux" : (ans[0] === 1 && ans[1] === 3 ? "sahtek" : (ans[0] === 1 ? "bilal" : "waslux"))));
      document.getElementById("hagain").addEventListener("click", () => { step = 0; ans = []; draw(); });
    }
  };
  draw();
})();

/* نافذة تفاصيل المنتج */
const sheet = document.getElementById("sheet"), sin = document.getElementById("sin");
function openSheet(i, push) {
  const p = SITE.products[i];
  if (!p) return;
  const opts = (p.options || []).map((o, gi) => '<div class="og"><div class="ol">' + esc(o[0]) + '</div><div class="oc">' + o[1].map(v => '<button type="button" class="ob" data-g="' + gi + '" data-v="' + esc(v) + '">' + esc(v) + '</button>').join("") + '</div></div>').join("");
  const ph = p.photos || [];
  const pvh = ph.length ? '<div class="pv"><div class="pvm"><img id="pimg" src="' + esc(ph[0].src) + '" alt="' + esc(p.name) + '"></div>' + (ph.length > 1 ? '<div class="pt">' + ph.map((x, k) => '<button type="button" class="pb' + (k ? '' : ' on') + '" data-k="' + k + '" aria-label="' + (k + 1) + '"><img loading="lazy" src="' + esc(x.src) + '" alt=""></button>').join("") + '</div>' : '') + (SITE.photoNote ? '<div class="pn">' + esc(SITE.photoNote) + '</div>' : '') + '</div>' : '';
  sin.innerHTML = '<button type="button" id="sx" aria-label="Close">&#10005;</button><div class="art">' + ART[p.art]() + '</div>' + pvh + '<div class="sub">' + esc(p.sub) + '</div><h2>' + esc(p.name) + '</h2><p class="tx">' + esc(p.text) + '</p><ul class="fl">' + p.features.map(f => '<li>' + esc(f) + '</li>').join("") + '</ul>' + (opts ? '<div class="opts">' + opts + '</div>' : '') + '<div class="prow"><span>' + esc(L.price) + '</span><b>' + esc(p.price || L.askPrice) + '</b></div><a class="btn cta" id="sorder" style="width:100%" href="' + esc(wa(SITE.orderMsg + p.name)) + '" target="_blank" rel="noopener">' + waIc + L.order + '</a>';
  sheet.hidden = false;
  document.body.style.overflow = "hidden";
  sin.scrollTop = 0;
  if (push) history.pushState({ s: p.id }, "", "#" + p.id);
  document.getElementById("sx").addEventListener("click", closeSheet);
  const showPhoto = k => {
    const im = document.getElementById("pimg");
    if (!im || !ph[k]) return;
    im.src = ph[k].src;
    sin.querySelectorAll(".pb").forEach(x => x.classList.toggle("on", +x.getAttribute("data-k") === k));
  };
  sin.querySelectorAll(".pb").forEach(b => b.addEventListener("click", () => showPhoto(+b.getAttribute("data-k"))));
  const sel = {};
  sin.querySelectorAll(".ob").forEach(b => b.addEventListener("click", () => {
    const gi = b.getAttribute("data-g"), v = b.getAttribute("data-v");
    sel[gi] = sel[gi] === v ? "" : v;
    if (sel[gi]) { const k = ph.findIndex(x => x.tags.includes(sel[gi])); if (k >= 0) showPhoto(k); }
    sin.querySelectorAll('.ob[data-g="' + gi + '"]').forEach(x => x.classList.toggle("on", sel[gi] === x.getAttribute("data-v")));
    const parts = (p.options || []).map((o, k) => sel[k] ? o[0] + ": " + sel[k] : "").filter(Boolean);
    document.getElementById("sorder").href = wa(SITE.orderMsg + p.name + (parts.length ? " — " + parts.join("، ") : ""));
  }));
}
function closeSheet() {
  if (history.state && history.state.s) history.back(); else hideSheet();
}
function hideSheet() { sheet.hidden = true; document.body.style.overflow = ""; }
document.querySelectorAll(".pc").forEach(b => b.addEventListener("click", () => openSheet(+b.getAttribute("data-i"), true)));
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
const OLD = { "personal-id": "smart-page", "business-id": "smart-page", "stand-id": "smart-page", "e-menu": "smart-page" };
const hid = () => { const h = location.hash.slice(1); return OLD[h] || h; };
window.addEventListener("popstate", () => {
  const id = hid(), i = SITE.products.findIndex(p => p.id === id);
  if (i > -1) openSheet(i, false); else hideSheet();
});
(function () {
  const id = hid(), i = SITE.products.findIndex(p => p.id === id);
  if (i > -1) openSheet(i, false);
})();
</script>
