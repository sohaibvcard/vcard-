<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14110c">
<title>Commander — Waslux</title>
<style>
:root{--bg:#f5eddc;--ink:#2b2013;--muted:#7d6e58;--gold:#a8741a;--gold2:#8a5e10;--ice:#2f8fc0;--line:rgba(120,90,30,.24);--line2:rgba(168,116,26,.5);--ok:#1f9d57;--err:#c0392b;--card:rgba(255,255,255,.72);--dark:#14110c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(80% 40% at 90% -5%,rgba(47,143,192,.16),transparent 62%),radial-gradient(80% 40% at 0 105%,rgba(168,116,26,.14),transparent 60%),var(--bg)}
.w{max-width:560px;margin:0 auto;padding-left:16px;padding-right:16px}
header{position:sticky;top:0;z-index:5;background:var(--dark);border-bottom:1px solid rgba(143,224,255,.25)}
.hd{display:flex;align-items:center;justify-content:space-between;height:54px}
.hd svg{height:26px;width:auto;display:block}
.hd small{color:#c9bfa8;font-size:13px}
.pg{height:3px;background:rgba(255,255,255,.12)}
.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fe0ff,#e6cf8e);box-shadow:0 0 12px rgba(143,224,255,.6);transition:width .45s cubic-bezier(.2,.8,.2,1)}
#app{padding-top:22px;padding-bottom:170px}
.enter{animation:in .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:27px;line-height:1.18;margin:0 0 8px;letter-spacing:-.2px}
h2{font-size:22px;line-height:1.22;margin:0 0 6px}
h3{font-size:16px;margin:0 0 2px}
p{margin:0 0 12px}
.sub{color:var(--muted);margin-bottom:18px}
.k{font-size:12.5px;color:var(--ice);font-weight:800;letter-spacing:1.2px;margin-bottom:8px;text-transform:uppercase}
.gl{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 24px rgba(90,60,10,.09);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sec{margin:22px 0 10px;font-size:12.5px;font-weight:800;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:44px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,rgba(47,143,192,.2),rgba(47,143,192,.07));border-color:var(--ice);box-shadow:0 0 14px rgba(47,143,192,.25);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:92px;padding:14px;text-align:start;color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,border-color .2s,box-shadow .2s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:26px;line-height:1}
.tile b{font-size:15px;line-height:1.25}
.tile[aria-pressed="true"]{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice),0 0 22px rgba(47,143,192,.2)}
.need{display:block;width:100%;padding:16px;margin-bottom:10px;text-align:start;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.need .t{display:flex;gap:12px;align-items:flex-start}
.need .ic{font-size:28px;line-height:1}
.need .d{color:var(--muted);font-size:14px;margin-top:2px}
.need .cb{margin-inline-start:auto;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center}
.need.on{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice),0 0 22px rgba(47,143,192,.2)}
.need.on .cb{background:var(--ice);border-color:var(--ice);color:#fff}
.need.on .cb::after{content:"✓";font-weight:900;font-size:16px}
.subq{padding:4px 2px 6px;margin:0 0 14px;animation:in .25s both}
.lb{font-size:13.5px;color:var(--muted);margin:10px 0 8px}
label.f{display:block;margin-bottom:14px;font-size:14px;font-weight:600}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=tel],textarea,select{display:block;width:100%;margin-top:7px;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:#a39477}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(47,143,192,.18)}
.tags{margin:0 0 16px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--line);margin:0 6px 8px 0}
.thumbs{display:flex;gap:10px;margin:4px 0 16px}
.thumbs img{flex:1;min-width:0;height:80px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.err{color:var(--err);font-weight:700;min-height:22px;margin:6px 0 0;font-size:14.5px}
.note{font-size:13.5px;color:var(--muted);background:rgba(255,255,255,.55);border:1px dashed var(--line2);border-radius:14px;padding:11px 13px;margin:14px 0}
.prod{display:flex;gap:12px;padding:10px;margin-bottom:10px;align-items:stretch}
.prod img{flex:none;width:84px;height:84px;object-fit:cover;border-radius:14px;background:#e9dfc8}
.prod .pb{flex:1;min-width:0;display:flex;flex-direction:column}
.prod p{font-size:13px;color:var(--muted);margin:0 0 6px;line-height:1.35}
.prod .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.prod .row b{color:var(--gold2)}
.prod.on{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice),0 0 18px rgba(47,143,192,.18)}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.9);font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.stp button:active{transform:scale(.94)}
.stp .q{min-width:22px;text-align:center;font-weight:800;font-size:17px}
.offer{padding:16px;margin:16px 0;border-color:var(--line2);background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(246,232,196,.8));box-shadow:0 0 30px rgba(168,116,26,.18),0 10px 28px rgba(90,60,10,.12);animation:in .3s both}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold2));padding:4px 11px;border-radius:999px;margin-bottom:8px}
.li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.li img{width:44px;height:44px;object-fit:cover;border-radius:9px;flex:none}
.big{font-size:28px;font-weight:800;color:var(--gold2);letter-spacing:-.5px}
.old{color:var(--muted);text-decoration:line-through;margin-inline-start:8px}
.save{display:inline-block;background:rgba(31,157,87,.12);border:1px solid rgba(31,157,87,.5);color:var(--ok);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:6px}
.ghost{background:none;border:0;color:var(--ice);font:inherit;font-size:15px;font-weight:700;padding:12px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sum{padding:14px 16px;margin-bottom:12px}
.sum .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sum .ed{font-size:13.5px;color:var(--ice);font-weight:800;background:none;border:0;cursor:pointer;font-family:inherit;padding:8px 0}
.sum ul{margin:0;padding:0;list-style:none}
.sum li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:15px}
.sum li span:first-child{color:var(--muted)}
.sum li span:last-child{text-align:end;font-weight:600;white-space:nowrap}
.sum li.wr span:last-child{white-space:normal}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800;padding:14px 16px;margin-bottom:12px}
.tot span:last-child{color:var(--gold2);font-size:22px}
.off{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;padding:12px 14px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.rd{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;margin-top:2px}
.off[aria-pressed="true"]{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice),0 0 18px rgba(47,143,192,.2)}
.off[aria-pressed="true"] .rd{border-color:var(--ice)}
.off[aria-pressed="true"] .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ice)}
.off .ob{flex:1;min-width:0}
.off .co{font-weight:800;font-size:15px}
.off .ad{color:var(--muted);font-size:13.5px;margin-top:2px;word-break:break-word}
.off .fe{flex:none;font-weight:800;color:var(--gold2);white-space:nowrap;font-size:15px}
.more{width:100%;margin:2px 0 12px}
.dfee{padding:14px 16px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dfee b{color:var(--gold2);font-size:19px}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(245,237,220,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto}
nav .tl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
nav .tl b{color:var(--gold2);font-size:18px}
nav .bt{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 20px;border-radius:16px;border:1px solid var(--line2);background:rgba(255,255,255,.85);color:var(--ink);font:inherit;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn.p{flex:1;background:linear-gradient(135deg,#2e2417,#14110c);border-color:#14110c;color:#f3dd98;box-shadow:0 8px 22px rgba(20,17,12,.3),0 0 0 1px rgba(143,224,255,.25)}
.btn.wa{flex:1;background:linear-gradient(135deg,#2ad26d,#13a851);border-color:#13a851;color:#04150b;box-shadow:0 8px 22px rgba(19,168,81,.3)}
.btn.full{width:100%;margin-bottom:10px;flex:none}
.btn[disabled]{opacity:.5}
.done{text-align:center}
.done .ok{width:76px;height:76px;margin:10px auto 16px;border-radius:50%;background:rgba(31,157,87,.12);border:2px solid var(--ok);color:var(--ok);display:grid;place-items:center;font-size:40px}
.todo{text-align:start;padding:16px;margin:16px 0}
.todo li{margin:6px 0}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
