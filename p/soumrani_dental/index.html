.tile.c2{background:var(--c1);color:var(--ivory)}

  mail: '<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  add: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  star: '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  img: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'
};

const BR = {
  instagram: '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>',
  facebook: '<svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" class="f"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6 0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64 0 3.33 2.76 5.7 5.69 5.7 3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24"><path d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.6 12 5.6 12 5.6s-6 0-7.9.5A3 3 0 0 0 2 8.2 31 31 0 0 0 1.6 12a31 31 0 0 0 .4 3.8 3 3 0 0 0 2.1 2.1c1.9.5 7.9.5 7.9.5s6 0 7.9-.5a3 3 0 0 0 2.1-2.1c.4-1.2.4-3.8.4-3.8s0-2.6-.4-3.8z"/><polygon points="10 15 15 12 10 9"/></svg>',
  whatsapp: ic.wa,
  google: '<svg viewBox="0 0 24 24" class="f"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  snapchat: '<svg viewBox="0 0 24 24"><path d="M12 3c3 0 5 2.2 5 5v2.5c0 .8.6 1.4 1.5 1.7.6.2.5.9-.2 1.2-.7.3-1.2.4-1.3 1-.2.9-.8 1.6-2 1.6-.7 0-1.2.4-2 .8-.6.3-1.5.3-2 0-.8-.4-1.3-.8-2-.8-1.2 0-1.8-.7-2-1.6-.1-.6-.6-.7-1.3-1-.7-.3-.8-1-.2-1.2.9-.3 1.5-.9 1.5-1.7V8c0-2.8 2-5 5-5z"/></svg>',
  telegram: '<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></svg>'
};
const brandOf = s => {
  const t = (String(s.url || "") + " " + String(s.name || "")).toLowerCase();
  if (/g\.page|google/.test(t)) return "google";
  if (/instagram|insta/.test(t)) return "instagram";
  if (/facebook|fb\.com|fb\.me/.test(t)) return "facebook";
  if (/tiktok/.test(t)) return "tiktok";
  if (/youtu/.test(t)) return "youtube";
  if (/wa\.me|whatsapp/.test(t)) return "whatsapp";
  if (/snapchat/.test(t)) return "snapchat";
  if (/t\.me|telegram/.test(t)) return "telegram";
  if (/linkedin/.test(t)) return "linkedin";
  if (/twitter|x\.com/.test(t)) return "x";
  return "";
};
const num = intl(SHOP.phone);
const waNum = intl(SHOP.whatsapp);
const menu = (SHOP.menu || []).filter(c => c && (c.items || []).length);
const menuImages = (SHOP.menuImages || []).filter(Boolean);
const gallery = (SHOP.gallery || []).filter(Boolean);

/* الألوان واللغة */
const th = Object.assign({}, TH[SHOP.theme] || TH.fire, SHOP.colors || {});
if (!th.tile) th.tile = th.c1;
if (!th.tileText) th.tileText = th.ivory;
const grid = SHOP.layout === "grid";
document.body.classList.toggle("g", grid);
const root = document.documentElement;
for (const k in th) root.style.setProperty("--" + k, th[k]);
root.style.setProperty("--line", rgba(th.accent, .3));
root.style.setProperty("--tilev", th.tile);
document.querySelector('meta[name="theme-color"]').setAttribute("content", th.bg);
root.lang = SHOP.lang;
root.dir = SHOP.lang === "ar" ? "rtl" : "ltr";
document.title = SHOP.name + (SHOP.tagline ? " — " + SHOP.tagline : "");

/* الغلاف والشعار والاسم */
let h = '<div class="cover"' + (SHOP.cover ? ' style="background-image:url(\'' + esc(SHOP.cover) + '\')"' : '') + '></div>';
const initials = String(SHOP.name || "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
h += '<div class="logo">' + (SHOP.logo ? '<img src="' + esc(SHOP.logo) + '" alt="' + esc(SHOP.name) + '"' + (SHOP.logoFit === "cover" ? ' style="object-fit:cover;padding:0"' : '') + '>' : '<div class="ini">' + esc(initials) + '</div>') + '</div>';
h += '<div class="head"><h1>' + esc(SHOP.name) + '</h1>';
if (SHOP.tagline) h += '<div class="tag">' + esc(SHOP.tagline) + '</div>';
if (SHOP.about) h += '<p class="about">' + esc(SHOP.about) + '</p>';
h += '</div><div class="sec">';

/* الأزرار */
const want = SHOP.buttons || [];
if (!grid && want.includes("menu") && (menu.length || menuImages.length)) h += '<button type="button" class="btn cta" id="menu">' + ic.book + esc(T.menu) + '</button>';
const B = {
  call:     () => num && ['tel:+' + num, ic.phone, T.call],
  whatsapp: () => waNum && ['https://wa.me/' + waNum, ic.wa, T.wa],
  email:    () => SHOP.email && ['mailto:' + SHOP.email, ic.mail, T.email],
  website:  () => safeUrl(SHOP.website) && [SHOP.website, ic.link, T.site],
  map:      () => safeUrl(SHOP.mapLink) && [SHOP.mapLink, ic.pin, T.map]
};
const small = grid ? [] : want.filter(k => B[k]).map(k => B[k]()).filter(Boolean);
let g = small.map((b, i) => '<a class="btn' + (small.length % 2 && i === small.length - 1 ? ' full' : '') + '" href="' + esc(b[0]) + '"' + (isWeb(b[0]) ? ' target="_blank" rel="noopener"' : '') + '>' + b[1] + esc(b[2]) + '</a>').join("");
if (!grid && want.includes("save")) g += '<button type="button" class="btn full" id="save">' + ic.add + esc(T.save) + '</button>';
if (g) h += '<div class="grid">' + g + '</div>';

/* صور المحل */
if (!grid && gallery.length) h += '<div class="st">' + esc(T.photos) + '</div><div class="gal">' + gallery.map(s => '<img loading="lazy" src="' + esc(s) + '" alt="">').join("") + '</div>';

/* أوقات العمل */
const hours = (SHOP.hours || []).filter(r => r && r[0]);
if (!grid && hours.length) h += '<div class="st">' + esc(T.hours) + '</div><div class="card">' + hours.map(r => '<div class="hr"><span>' + esc(r[0]) + '</span><span>' + esc(r[1] || "") + '</span></div>').join("") + '</div>';

/* بيانات التواصل */
const R = {
  phone:   () => SHOP.phone && ['tel:+' + num, ic.phone, SHOP.phone, 1],
  phone2:  () => SHOP.phone2 && ['tel:+' + intl(SHOP.phone2), ic.phone, SHOP.phone2, 1],
  email:   () => SHOP.email && ['mailto:' + SHOP.email, ic.mail, SHOP.email, 1],
  address: () => SHOP.address && [safeUrl(SHOP.mapLink), ic.pin, SHOP.address, 0],
  website: () => safeUrl(SHOP.website) && [SHOP.website, ic.link, SHOP.website.replace(/^https?:\/\//i, ""), 1]
};
const rows = (SHOP.info || []).map(k => R[k] && R[k]()).filter(Boolean).map(r => {
  const inner = r[1] + '<span' + (r[3] ? ' class="ltr"' : '') + '>' + esc(r[2]) + '</span>';
  return r[0] ? '<a class="row" href="' + esc(r[0]) + '"' + (isWeb(r[0]) ? ' target="_blank" rel="noopener"' : '') + '>' + inner + '</a>' : '<div class="row">' + inner + '</div>';
}).join("");
if (!grid && rows) h += '<div class="st">' + esc(T.contact) + '</div><div class="card">' + rows + '</div>';

/* الشكل grid: مربعات بنمط bento تُبنى من نفس البيانات */
let infoHtml = "";
if (grid) {
  const span = n => {
    if (n < 1) return [];
    if (n === 1) return ["s6"];
    if (n === 2) return ["s3", "s3"];
    const o = new Array(n).fill(""), r = n % 3;
    if (r === 1) o[n - 1] = "s6";
    if (r === 2) { o[n - 1] = "s3"; o[n - 2] = "s3"; }
    return o;
  };
  const tl = (x, cls, i) => {
    const inner = '<i class="ti">' + x[2] + '</i><div class="tx"><span class="tl" dir="auto">' + esc(x[3]) + '</span>' + (x[4] ? '<em>' + esc(x[4]) + '</em>' : '') + '</div>';
    const st = ' style="--i:' + i + '"';
    return x[0] === "a"
      ? '<a class="tile ' + cls + '" href="' + esc(x[1]) + '"' + (isWeb(x[1]) ? ' target="_blank" rel="noopener"' : '') + st + '>' + inner + '</a>'
      : '<button type="button" class="tile ' + cls + '" id="' + x[1] + '"' + st + '>' + inner + '</button>';
  };
  const P = {
    whatsapp: () => waNum && ["a", "https://wa.me/" + waNum, ic.wa, T.wa, SHOP.whatsapp],
    call:     () => num && ["a", "tel:+" + num, ic.phone, T.call, SHOP.phone],
    map:      () => safeUrl(SHOP.mapLink) && ["a", SHOP.mapLink, ic.pin, T.mapShort || T.map, ""]
  };
  const prim = ["whatsapp", "call", "map"].filter(k => want.includes(k)).map(k => P[k]()).filter(Boolean).map(x => x.concat("c2"));
  const TL = {
    menu:    () => (menu.length || menuImages.length) && ["b", "menu", ic.book, T.menuShort],
    photos:  () => gallery.length && ["b", "ph", ic.img, T.photos],
    reviews: () => safeUrl(SHOP.reviews) && ["a", SHOP.reviews, ic.star, T.reviews],
    booking: () => safeUrl(SHOP.booking) && ["a", SHOP.booking, ic.cal, T.booking],
    website: () => safeUrl(SHOP.website) && ["a", SHOP.website, ic.globe, T.siteShort],
    email:   () => SHOP.email && ["a", "mailto:" + SHOP.email, ic.mail, T.email],
    save:    () => ["b", "save", ic.add, T.save],
    info:    () => (hours.length || rows) && ["b", "inf", ic.clock, T.info]
  };
  const sec = (SHOP.tiles || []).map(k => TL[k] && TL[k]()).filter(Boolean);
  const all = prim.concat(sec);
  if (all.length) {
    const m = all.length - 1;
    let out = tl(all[0], "big" + (m === 0 ? " w" : ""), 0);
    const sm = all.slice(1);
    const cl = (x) => x[5] ? "c2" : "";
    if (m === 1) out += tl(sm[0], cl(sm[0]) + " tall", 1);
    else {
      sm.slice(0, 2).forEach((x, i) => { out += tl(x, cl(x), i + 1); });
      const rest = sm.slice(2), sp = span(rest.length);
      rest.forEach((x, i) => { out += tl(x, (cl(x) + " " + sp[i]).trim(), i + 3); });
    }
    h += '<div class="tiles">' + out + '</div>';
  }
  if (hours.length) infoHtml += '<div class="st">' + esc(T.hours) + '</div><div class="card">' + hours.map(r => '<div class="hr"><span>' + esc(r[0]) + '</span><span>' + esc(r[1] || "") + '</span></div>').join("") + '</div>';
  if (rows) infoHtml += '<div class="st">' + esc(T.contact) + '</div><div class="card">' + rows + '</div>';
}

/* حسابات التواصل */
const soc = (SHOP.social || []).filter(s => safeUrl(s.url));
if (soc.length) h += '<div class="social">' + soc.map(s => '<a class="sb' + (brandOf(s) ? ' b-' + brandOf(s) : '') + '" href="' + esc(s.url) + '" target="_blank" rel="noopener" aria-label="' + esc(s.name) + '" title="' + esc(s.name) + '">' + (BR[brandOf(s)] || ic.link) + '</a>').join("") + '</div>';

if (SHOP.credit && SHOP.credit.url) h += '<div class="credit"><a href="' + esc(SHOP.credit.url) + '" target="_blank" rel="noopener">' + esc(SHOP.credit.text) + '</a></div>';
h += '</div>';
document.getElementById("app").innerHTML = h;

/* عارض الصور (صور المحل) */
const viewer = document.getElementById("viewer"), vbox = document.getElementById("vbox");
function openViewer(list, start) {
  vbox.innerHTML = list.map(s => '<img loading="lazy" src="' + esc(s) + '" alt="">').join("");
  viewer.hidden = false;
  document.body.style.overflow = "hidden";
  history.pushState({ v: 1 }, "");
  viewer.scrollTop = 0;
  const t = vbox.children[start || 0];
  if (t && start) setTimeout(() => { viewer.scrollTop = t.offsetTop - 64; }, 40);
}
function closeViewer() { viewer.hidden = true; document.body.style.overflow = ""; }
document.getElementById("vx").addEventListener("click", () => { if (history.state && history.state.v) history.back(); else closeViewer(); });
document.querySelectorAll(".gal img").forEach((im, i) => im.addEventListener("click", () => openViewer(gallery, i)));
const phb = document.getElementById("ph");
if (phb) phb.addEventListener("click", () => openViewer(gallery, 0));
/* ورقة المعلومات (grid) */
const hs = document.getElementById("hs");
function closeInfo() { hs.hidden = true; document.body.style.overflow = ""; }
function openInfo() { document.getElementById("ht").textContent = T.info; document.getElementById("hb").innerHTML = infoHtml; hs.hidden = false; document.body.style.overflow = "hidden"; history.pushState({ v: 1 }, ""); }
document.getElementById("hx").addEventListener("click", () => { if (history.state && history.state.v) history.back(); else closeInfo(); });
const infb = document.getElementById("inf");
if (infb) infb.addEventListener("click", openInfo);

/* القائمة الإلكترونية */
const mv = document.getElementById("mv"), mbody = document.getElementById("mbody"), mtabs = document.getElementById("mtabs"), mq = document.getElementById("mq");
function closeMenu() { mv.hidden = true; document.body.style.overflow = ""; }
function filterMenu(q) {
  q = q.trim().toLowerCase();
  let total = 0;
  document.querySelectorAll("#mbody section").forEach(sec => {
    let any = false;
    sec.querySelectorAll(".it").forEach(it => { const ok = !q || it.getAttribute("data-s").indexOf(q) > -1; it.hidden = !ok; if (ok) any = true; });
    sec.hidden = !any;
    if (any) total++;
  });
  const em = document.getElementById("mempty");
  if (em) em.hidden = total > 0;
}
if (menu.length) {
  document.getElementById("mt").textContent = T.menu;
  mq.placeholder = T.search;
  mbody.innerHTML = menu.map((c, i) => '<section id="cat' + i + '"><h3><span style="color:inherit;font-weight:inherit">' + esc(c.cat) + '</span>' + (c.catAr ? '<span dir="auto">' + esc(c.catAr) + '</span>' : '') + '</h3>' +
    c.items.map(it => '<div class="it" data-s="' + esc((it[0] + " " + (it[1] || "")).toLowerCase()) + '"><div class="in"><b dir="auto">' + esc(it[0]) + '</b>' + (it[1] ? '<span dir="auto">' + esc(it[1]) + '</span>' : '') + '</div>' +
    (it[2] != null && it[2] !== "" ? '<div class="ip">' + esc(it[2]) + (SHOP.currency ? ' ' + esc(SHOP.currency) : '') + '</div>' : '') + '</div>').join("") + '</section>').join("") +
    '<div class="empty" id="mempty" hidden>' + esc(T.none) + '</div>';
  mtabs.innerHTML = menu.map((c, i) => '<button type="button" data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + esc(c.cat) + '</button>').join("");
  mq.addEventListener("input", () => filterMenu(mq.value));
  mtabs.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    mq.value = ""; filterMenu("");
    mtabs.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    const s = document.getElementById("cat" + b.getAttribute("data-i"));
    if (s) s.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  mbody.addEventListener("scroll", () => {
    const top = mbody.getBoundingClientRect().top;
    let cur = 0;
    menu.forEach((c, i) => { const s = document.getElementById("cat" + i); if (s && !s.hidden && s.getBoundingClientRect().top - top <= 60) cur = i; });
    if (mbody.scrollTop + mbody.clientHeight >= mbody.scrollHeight - 4) cur = menu.length - 1;
    mtabs.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === cur));
  });
}
function openMenu() {
  mv.hidden = false;
  document.body.style.overflow = "hidden";
  history.pushState({ v: 1 }, "");
  mq.value = ""; filterMenu("");
  mbody.scrollTop = 0;
}
document.getElementById("mx").addEventListener("click", () => { if (history.state && history.state.v) history.back(); else closeMenu(); });
window.addEventListener("popstate", () => { closeViewer(); closeMenu(); closeInfo(); });
const mb = document.getElementById("menu");
if (mb) mb.addEventListener("click", () => { if (menu.length) openMenu(); else openViewer(menuImages, 0); });

/* حفظ جهة الاتصال (vCard) */
const v = s => String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
const sb = document.getElementById("save");
if (sb) sb.addEventListener("click", () => {
  const L = ["BEGIN:VCARD", "VERSION:3.0", "N:" + v(SHOP.name) + ";;;;", "FN:" + v(SHOP.name), "ORG:" + v(SHOP.name)];
  if (SHOP.tagline) L.push("TITLE:" + v(SHOP.tagline));
  if (num) L.push("TEL;TYPE=WORK:+" + num);
  if (SHOP.email) L.push("EMAIL:" + v(SHOP.email));
  if (SHOP.address) L.push("ADR;TYPE=WORK:;;" + v(SHOP.address) + ";;;;");
  if (safeUrl(SHOP.website)) L.push("URL:" + SHOP.website);
  L.push("END:VCARD");
  const blob = new Blob([L.join("\r\n")], { type: "text/vcard;charset=utf-8" });
  const el = document.createElement("a");
  el.href = URL.createObjectURL(blob);
  el.download = (SHOP.name.replace(/\s+/g, "_") || "contact") + ".vcf";
  document.body.appendChild(el);
  el.click();
  el.remove();
});
</script>
</body>
</html
