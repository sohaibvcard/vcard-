<head>

<title>Business Profile</title>
<style>
:root{--bg:#120e0c;--glow:#2a1a10;--c1:#1c1613;--c2:#15100e;--ivory:#fff3e6;--muted:#c4ad9b;--accent:#ff6b1a;--g1:#ffb703;--g2:#ff6b1a;--on:#1a0d04;--line:rgba(255,107,26,.3)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--ivory);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.cover{height:200px;background:linear-gradient(135deg,var(--g2),var(--glow));background-size:cover;background-position:center;border-radius:0 0 28px 28px;position:relative}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.logo{width:112px;height:112px;margin:-56px auto 0;border-radius:50%;border:4px solid var(--bg);background:var(--c1);position:relative;z-index:2;overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:contain;padding:8px}
.ini{font-family:Georgia,serif;font-size:36px;font-weight:700;color:var(--accent)}
.head{text-align:center;padding:14px 20px 0}
h1{font-size:30px;font-weight:800;letter-spacing:.3px;line-height:1.2}
.tag{margin-top:10px;display:inline-block;padding:5px 14px;border-radius:999px;background:var(--c1);border:1px solid var(--line);color:var(--accent);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.about{margin-top:14px;color:var(--muted);font-size:15px;line-height:1.8}
.sec{padding:0 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:14px;border:1px solid var(--line);color:var(--ivory);text-decoration:none;font-size:15px;background:var(--c1);font-family:inherit;cursor:pointer;width:100%}
.btn svg,.row svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.cta{margin-top:22px;padding:18px 12px;font-size:17px;font-weight:800;border:0;border-radius:18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.btn.cta svg{width:22px;height:22px}
.btn:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn.full{grid-column:1/-1}
.st{margin:30px 0 12px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;text-align:start}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid var(--line);display:block;cursor:pointer;background:var(--c1)}
.gal img:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:16/9}
.card{background:var(--c1);border:1px solid var(--line);border-radius:16px;padding:4px 16px;text-align:start}
.hr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hr:last-child,.row:last-child{border-bottom:0}
.hr span:last-child{color:var(--muted);direction:ltr}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ivory);text-decoration:none;font-size:15px;word-break:break-word}
.row svg{color:var(--accent)}
.social{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}
.social.brand{flex-direction:column;align-items:stretch;gap:12px}
.sbtn{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--c1);color:var(--ivory);text-decoration:none;font-size:15px;font-weight:600}
.sbtn:active{transform:scale(.98)}
.sbtn i{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.sbtn i svg{width:22px;height:22px}
.sbtn.ig i{background:linear-gradient(45deg,#f9ce34,#ee2a7b 55%,#6228d7)}
.sbtn.tk i{background:#000}
.sbtn.wa i{background:#25D366}
.sbtn.fb i{background:#1877F2}
.chip{display:flex;align-items:center;gap:7px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--c1);color:var(--ivory);text-decoration:none;font-size:14px}
.chip svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ltr{direction:ltr;unicode-bidi:embed}
html[dir=rtl] .st,html[dir=rtl] .tag{letter-spacing:0}
html[dir=rtl] .hr span:last-child{direction:rtl}
.credit{margin-top:26px;text-align:center;font-size:12px;direction:ltr}
.credit a{color:var(--muted);text-decoration:none;opacity:.8}
#viewer{position:fixed;inset:0;background:rgba(8,6,5,.97);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:64px 12px calc(24px + env(safe-area-inset-bottom))}
#viewer[hidden]{display:none}
#vx{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline-end:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:20px;z-index:51;cursor:pointer}
#vbox img{display:block;width:100%;max-width:720px;margin:0 auto 14px;border-radius:12px}
#mv{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
#mv[hidden]{display:none}
.mvh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
#mt{font-size:20px;font-weight:800}
#mx{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:18px;cursor:pointer;flex:none}
.mvs{padding:0 16px 10px}
#mq{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:16px;font-family:inherit;outline:none}
#mq::placeholder{color:var(--muted)}
.mvtabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mvtabs::-webkit-scrollbar{display:none}
.mvtabs button{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
.mvtabs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border:0;font-weight:700}
.mvb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.mvb section{margin-bottom:22px}
.mvb h3{position:sticky;top:0;z-index:1;background:var(--bg);padding:10px 0;font-size:17px;font-weight:800;color:var(--accent);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.mvb h3 span{font-weight:600;color:var(--muted)}
.it{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it[hidden],.mvb section[hidden],.empty[hidden]{display:none}
.in b{display:block;font-size:16px;font-weight:700}
.in span{display:block;margin-top:3px;color:var(--muted);font-size:14px}
html[dir=ltr] .in span{text-align:left}
html[dir=rtl] .in span{text-align:right}
.ip{flex:none;font-weight:800;color:var(--accent);font-size:16px;direction:ltr;white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
</style>
</head>

/* ================= نهاية قسم البيانات ================= */

  gold:  { bg:"#0b0b0c", glow:"#1f1b11", c1:"#171716", c2:"#101011", ivory:"#f1e9d8", muted:"#a9a293", accent:"#c8a85a", g1:"#e6cf8e", g2:"#b59443", on:"#17130a" },

const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const isWeb = u => /^https?:\/\//i.test(u);
const rgba = (h, a) => { const n = parseInt(h.replace("#", ""), 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; };
const intl = n => {
  let d = String(n || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  else if (d.startsWith("0")) d = SHOP.countryCode + d.slice(1);
  return d;
};
const ic = {
  phone: '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',

/* أوقات العمل */
const hours = (SHOP.hours || []).filter(r => r && r[0]);
if (hours.length) h += '<div class="st">' + esc(T.hours) + '</div><div class="card">' + hours.map(r => '<div class="hr"><span>' + esc(r[0]) + '</span><span>' + esc(r[1] || "") + '</span></div>').join("") + '</div>';

/* بيانات التواصل */
const R = {
  phone:   () => SHOP.phone && ['tel:+' + num, ic.phone, SHOP.phone, 1],
  phone2:  () => SHOP.phone2 && ['tel:+' + intl(SHOP.phone2), ic.phone, SHOP.phone2, 1],
  email:   () => SHOP.email && ['mailto:' + SHOP.email, ic.mail, SHOP.email, 1],
  address: () => SHOP.address && [safeUrl(SHOP.mapLink), ic.pin, SHOP.address, 0],
  website: () => safeUrl(SHOP.website) && [SHOP.website, ic.link, SHOP.website.replace(/^https?:\/\//i, ""), 1]
};
const rows = (SHOP.info || []).map(k => R[k] && R[k]()).filter(Boolean).map(r => {
  const inner = r[1] + '<span' + (r[3] ? ' class="ltr"' : '') + '>' + esc(r[2]) + '</span>';
  return r[0] ? '<a class="row" href="' + esc(r[0]) + '"' + (isWeb(r[0]) ? ' target="_blank" rel="noopener"' : '') + '>' + inner + '</a>' : '<div class="row">' + inner + '</div>';
}).join("");
if (rows) h += '<div class="st">' + esc(T.contact) + '</div><div class="card">' + rows + '</div>';

/* حسابات التواصل */
const soc = (SHOP.social || []).filter(s => safeUrl(s.url));
const SOCSVG = {
  facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.44 18.63.07 12 .07S0 5.44 0 12.07c0 5.99 4.39 10.95 10.13 11.85v-8.39H7.08v-3.47h3.05V9.43c0-3.01 1.79-4.67 4.53-4.67 1.31 0 2.69.23 2.69.23v2.95h-1.52c-1.49 0-1.96.93-1.96 1.87v2.25h3.33l-.53 3.47h-2.8v8.39C19.61 23.03 24 18.06 24 12.07z"/></svg>',
  whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.08-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.78h-.01a9.9 9.9 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88zM20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.42z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 6.3a4.8 4.8 0 0 1-3.8-4.3h-3.4v13.3a2.9 2.9 0 1 1-2-2.8V8.9a6.3 6.3 0 1 0 5.4 6.3V9.1a8.1 8.1 0 0 0 4.7 1.5V7.2a4.8 4.8 0 0 1-.9-.9z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>'
};
const socKey = s => /tiktok/i.test(s.name) ? "tiktok" : /instagram/i.test(s.name) ? "instagram" : /whatsapp/i.test(s.name) ? "whatsapp" : /facebook/i.test(s.name) ? "facebook" : "";
if (soc.length) h += '<div class="social brand">' + soc.map(s => { const k = socKey(s); return k ? '<a class="sbtn ' + ({ tiktok: "tk", whatsapp: "wa", instagram: "ig", facebook: "fb" })[k] + '" href="' + esc(s.url) + '" target="_blank" rel="noopener"><i>' + SOCSVG[k] + '</i>' + ({ whatsapp: "Contactez-nous sur WhatsApp", tiktok: "Suivez-nous sur TikTok", instagram: "Suivez-nous sur Instagram", facebook: "Suivez-nous sur Facebook" })[k] + '</a>' : '<a class="chip" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + ic.link + esc(s.name) + '</a>'; }).join("") + '</div>';

if (SHOP.credit && SHOP.credit.url) h += '<div class="credit"><a href="' + esc(SHOP.credit.url) + '" target="_blank" rel="noopener">' + esc(SHOP.credit.text) + '</a></div>';
h += '</div>';
document.getElementById("app").innerHTML = h;

/* عارض الصور (صور المحل) */
const viewer = document.getElementById("viewer"), vbox = document.getElementById("vbox");
function openViewer(list, start) {
  vbox.innerHTML = list.map(s => '<img loading="lazy" src="' + esc(s) + '" alt="">').join("");
  viewer.hidden = false;
  document.body.style.overflow = "hidden";
  history.pushState({ v: 1 }, "");
  viewer.scrollTop = 0;
  const t = vbox.children[start || 0];
  if (t && start) setTimeout(() => { viewer.scrollTop = t.offsetTop - 64; }, 40);
}
function closeViewer() { viewer.hidden = true; document.body.style.overflow = ""; }
document.getElementById("vx").addEventListener("click", () => { if (history.state && history.state.v) history.back(); else closeViewer(); });
document.querySelectorAll(".gal img").forEach((im, i) => im.addEventListener("click", () => openViewer(gallery, i)));

/* القائمة الإلكترونية */
const mv = document.getElementById("mv"), mbody = document.getElementById("mbody"), mtabs = document.getElementById("mtabs"), mq = document.getElementById("mq");
function closeMenu() { mv.hidden = true; document.body.style.overflow = ""; }
function filterMenu(q) {
  q = q.trim().toLowerCase();
  let total = 0;
  document.querySelectorAll("#mbody section").forEach(sec => {
    let any = false;
    sec.querySelectorAll(".it").forEach(it => { const ok = !q || it.getAttribute("data-s").indexOf(q) > -1; it.hidden = !ok; if (ok) any = true; });
    sec.hidden = !any;
    if (any) total++;
  });
  const em = document.getElementById("mempty");
  if (em) em.hidden = total > 0;
}
if (menu.length) {
  document.getElementById("mt").textContent = T.menu;
  mq.placeholder = T.search;
  mbody.innerHTML = menu.map((c, i) => '<section id="cat' + i + '"><h3><span style="color:inherit;font-weight:inherit">' + esc(c.cat) + '</span>' + (c.catAr ? '<span dir="auto">' + esc(c.catAr) + '</span>' : '') + '</h3>' +
    c.items.map(it => '<div class="it" data-s="' + esc((it[0] + " " + (it[1] || "")).toLowerCase()) + '"><div class="in"><b dir="auto">' + esc(it[0]) + '</b>' + (it[1] ? '<span dir="auto">' + esc(it[1]) + '</span>' : '') + '</div>' +
    (it[2] != null && it[2] !== "" ? '<div class="ip">' + esc(it[2]) + (SHOP.currency ? ' ' + esc(SHOP.currency) : '') + '</div>' : '') + '</div>').join("") + '</section>').join("") +
    '<div class="empty" id="mempty" hidden>' + esc(T.none) + '</div>';
  mtabs.innerHTML = menu.map((c, i) => '<button type="button" data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + esc(c.cat) + '</button>').join("");
  mq.addEventListener("input", () => filterMenu(mq.value));
  mtabs.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    mq.value = ""; filterMenu("");
    mtabs.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    const s = document.getElementById("cat" + b.getAttribute("data-i"));
    if (s) s.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  mbody.addEventListener("scroll", () => {
    const top = mbody.getBoundingClientRect().top;
    let cur = 0;
    menu.forEach((c, i) => { const s = document.getElementById("cat" + i); if (s && !s.hidden && s.getBoundingClientRect().top - top <= 60) cur = i; });
    if (mbody.scrollTop + mbody.clientHeight >= mbody.scrollHeight - 4) cur = menu.length - 1;
    mtabs.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === cur));
  });
}
function openMenu() {
  mv.hidden = false;
  document.body.style.overflow = "hidden";
  history.pushState({ v: 1 }, "");
  mq.value = ""; filterMenu("");
  mbody.scrollTop = 0;
}
document.getElementById("mx").addEventListener("click", () => { if (history.state && history.state.v) history.back(); else closeMenu(); });
window.addEventListener("popstate", () => { closeViewer(); closeMenu(); });
const mb = document.getElementById("menu");
if (mb) mb.addEventListener("click", () => { if (menu.length) openMenu(); else openViewer(menuImages, 0); });

/* حفظ جهة الاتصال (vCard) */
const v = s => String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
const sb = document.getElementById("save");
if (sb) sb.addEventListener("click", () => {
  const L = ["BEGIN:VCARD", "VERSION:3.0", "N:" + v(SHOP.name) + ";;;;", "FN:" + v(SHOP.name), "ORG:" + v(SHOP.name)];
  if (SHOP.tagline) L.push("TITLE:" + v(SHOP.tagline));
  if (num) L.push("TEL;TYPE=WORK:+" + num);
  if (SHOP.email) L.push("EMAIL:" + v(SHOP.email));
  if (SHOP.address) L.push("ADR;TYPE=WORK:;;" + v(SHOP.address) + ";;;;");
  if (safeUrl(SHOP.website)) L.push("URL:" + SHOP.website);
  L.push("END:VCARD");
  const blob = new Blob([L.join("\r\n")], { type: "text/vcard;charset=utf-8" });
  const el = document.createElement("a");
  el.href = URL.createObjectURL(blob);
  el.download = (SHOP.name.replace(/\s+/g, "_") || "contact") + ".vcf";
  document.body.appendChild(el);
  el.click();
  el.remove();
});
</script>
</body>
</html>
