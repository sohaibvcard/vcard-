<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Modifier ma page · Waslux</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1f1b16;--mut:#7a7061;--line:#e3dac8;--ac:#b8893b;--ok:#2f7d4f;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;line-height:1.5}
.w{max-width:640px;margin:0 auto;padding:14px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;margin:8px 0 2px}.sub{color:var(--mut);font-size:14px;margin:0 0 6px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.c h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 0}
input,textarea{width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea{min-height:80px}
.ltr{direction:ltr;text-align:left}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.s{padding:8px 11px;font-size:14px}
button.d{background:#fff;color:var(--bad);border:1px solid var(--line)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#fff}
.item.off{opacity:.55}
.r2{display:grid;grid-template-columns:1fr 110px;gap:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sw{display:flex;align-items:center;gap:6px;font-weight:600;margin:0}
.sw input{width:auto;margin:0}
.cat{display:flex;gap:8px;align-items:center;margin-top:14px}
.cat input{font-weight:700}
.hr{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}
.hr input{margin:0}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}
.bar button{flex:1;max-width:320px}
#msg{font-size:14px;min-height:20px;text-align:center;margin:4px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hint{font-size:13px;color:var(--mut);margin:4px 0 0}
</style>
</head>
<body>
<div class="w">
 <div class="top"><div><h1 id="t_title"></h1><p class="sub" id="t_sub"></p></div><button class="g s" id="lang" type="button">العربية</button></div>
 <div id="err" class="c bad" hidden></div>
 <div id="app" hidden>
  <div class="c"><h2 id="t_info"></h2><div id="info"></div></div>
  <div class="c"><h2 id="t_hours"></h2><div id="hours"></div><div class="tools"><button class="g s" id="addh" type="button"></button></div></div>
  <div class="c"><h2 id="t_menu"></h2><p class="hint" id="t_menu_h"></p><div id="menu"></div><div class="tools"><button class="g s" id="addc" type="button"></button></div></div>
  <div id="msg" role="status"></div>
 </div>
</div>
<div class="bar" id="bar" hidden><button id="save" type="button"></button><button class="g" id="view" type="button"></button></div>
<script>
var API = "https://script.google.com/macros/s/AKfycbwAtJKTzuqkcJ6RaJ3IGknOcxp69G40peuWyikTIbaKiIBuGTVUpI_yi4yC5dMq8zg/exec?a=csv&s=test-x";
var $ = function (i) { return document.getElementById(i); };
var P = {}; (location.hash.slice(1) + "&" + location.search.slice(1)).split("&").forEach(function (x) { var a = x.split("="); if (a[0] && !(a[0] in P)) P[a[0]] = decodeURIComponent(a[1] || ""); });
var S = P.s || "", K = P.k || "";
var TX = {
 fr: { title: "Modifier ma page", sub: "Vos changements apparaissent sur votre page après l’enregistrement.", info: "Informations", hours: "Horaires", menu: "Menu", menu_h: "Décochez « Disponible » pour masquer un plat épuisé.", addh: "+ Ajouter une ligne", addc: "+ Ajouter une catégorie", save: "Enregistrer", view: "Voir ma page", name: "Nom", desc: "Description", price: "Prix", avail: "Disponible", del: "Supprimer", up: "↑", down: "↓", additem: "+ Ajouter un plat", cat: "Nom de la catégorie", hday: "Jours", hh: "Heures", saved: "✓ Enregistré. Votre page est à jour.", saving: "Enregistrement…", loading: "Chargement…", e_link: "Lien invalide. Demandez-nous votre lien de modification sur WhatsApp.", e_key: "Lien non valide ou désactivé. Contactez Waslux.", e_net: "Connexion impossible. Réessayez.", e_price: "Le prix doit être un nombre.", e_lock: "Trop d’essais. Réessayez dans quelques minutes.", confirm: "Supprimer ?", unsaved: "Modifications non enregistrées.", k: { phone: "Téléphone", whatsapp: "WhatsApp", address: "Adresse", tagline: "Phrase courte", about: "Présentation", mapLink: "Lien Google Maps", reviewLink: "Lien avis Google", phone2: "Deuxième téléphone", email: "E-mail", website: "Site web" } },
 ar: { title: "تعديل صفحتي", sub: "تظهر تغييراتك على صفحتك بعد الحفظ.", info: "المعلومات", hours: "أوقات العمل", menu: "القائمة", menu_h: "ألغِ «متوفر» لإخفاء صنف نفد.", addh: "+ إضافة سطر", addc: "+ إضافة قسم", save: "حفظ", view: "عرض صفحتي", name: "الاسم", desc: "الوصف", price: "السعر", avail: "متوفر", del: "حذف", up: "↑", down: "↓", additem: "+ إضافة صنف", cat: "اسم القسم", hday: "الأيام", hh: "الساعات", saved: "✓ تم الحفظ. صفحتك محدّثة.", saving: "جارٍ الحفظ…", loading: "جارٍ التحميل…", e_link: "الرابط غير صالح. اطلب منا رابط التعديل على واتساب.", e_key: "الرابط غير صالح أو معطّل. تواصل مع Waslux.", e_net: "تعذر الاتصال. حاول مرة أخرى.", e_price: "السعر يجب أن يكون رقماً.", e_lock: "محاولات كثيرة. حاول بعد دقائق.", confirm: "حذف؟", unsaved: "تعديلات غير محفوظة.", k: { phone: "الهاتف", whatsapp: "واتساب", address: "العنوان", tagline: "جملة قصيرة", about: "نبذة", mapLink: "رابط الخريطة", reviewLink: "رابط تقييم Google", phone2: "هاتف ثانٍ", email: "البريد", website: "الموقع" } }
};
var L = "fr"; try { L = localStorage.getItem("wl-edit-l") || ((navigator.language || "").indexOf("ar") === 0 ? "ar" : "fr"); } catch (e) {}
var INFO_ORDER = ["phone", "whatsapp", "address", "tagline", "about", "mapLink", "reviewLink", "phone2", "email", "website"];
var LTR = { phone: 1, whatsapp: 1, mapLink: 1, reviewLink: 1, phone2: 1, email: 1, website: 1 };
var M = { info: {}, hours: [], menu: [] }, dirty = false;
function t(k) { return TX[L][k]; }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function say(txt, cls) { $("msg").textContent = txt || ""; $("msg").className = cls || ""; }
function fail(k) { $("err").hidden = false; $("err").textContent = t(k); $("app").hidden = true; $("bar").hidden = true; }

function applyLang() {
  document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  $("lang").textContent = L === "ar" ? "Français" : "العربية";
  $("t_title").textContent = t("title"); $("t_sub").textContent = t("sub"); $("t_info").textContent = t("info"); $("t_hours").textContent = t("hours"); $("t_menu").textContent = t("menu"); $("t_menu_h").textContent = t("menu_h");
  $("addh").textContent = t("addh"); $("addc").textContent = t("addc"); $("save").textContent = t("save"); $("view").textContent = t("view");
  render();
}
function fromRows(rows) {
  M = { info: {}, hours: [], menu: [] }; var idx = {};
  rows.forEach(function (r) {
    if (r[0] === "info") M.info[r[1]] = r[2];
    else if (r[0] === "hours") M.hours.push([r[1], r[2]]);
    else if (r[0] === "menu") { if (!(r[1] in idx)) { idx[r[1]] = M.menu.length; M.menu.push({ cat: r[1], items: [] }); } M.menu[idx[r[1]]].items.push({ n: r[2], d: r[3], p: r[4], on: !/^(non|no|0|false)$/i.test(r[5] || "") }); }
  });
}
function toRows() {
  var rows = [];
  INFO_ORDER.forEach(function (k) { if ((M.info[k] || "").trim()) rows.push(["info", k, M.info[k].trim(), "", "", ""]); });
  M.hours.forEach(function (h) { if ((h[0] || "").trim()) rows.push(["hours", h[0].trim(), (h[1] || "").trim(), "", "", ""]); });
  M.menu.forEach(function (c) { var cn = (c.cat || "").trim() || "Menu"; c.items.forEach(function (i) { if ((i.n || "").trim()) rows.push(["menu", cn, i.n.trim(), (i.d || "").trim(), String(i.p || "").trim(), i.on ? "oui" : "non"]); }); });
  return rows;
}
function render() {
  var h = "";
  INFO_ORDER.forEach(function (k) {
    if (!(k in M.info) && ["phone2", "email", "website"].indexOf(k) > -1) return;
    var v = M.info[k] || "", multi = k === "about";
    h += '<label>' + esc(t("k")[k]) + (multi ? '<textarea data-i="' + k + '">' + esc(v) + '</textarea>' : '<input data-i="' + k + '" class="' + (LTR[k] ? "ltr" : "") + '" value="' + esc(v) + '">') + '</label>';
  });
  $("info").innerHTML = h;
  $("hours").innerHTML = M.hours.map(function (x, i) { return '<div class="hr"><input data-h="' + i + '.0" placeholder="' + esc(t("hday")) + '" value="' + esc(x[0]) + '"><input data-h="' + i + '.1" placeholder="' + esc(t("hh")) + '" value="' + esc(x[1]) + '"><button class="d s" data-a="delh" data-i="' + i + '" type="button">✕</button></div>'; }).join("");
  $("menu").innerHTML = M.menu.map(function (c, ci) {
    return '<div class="cat"><input data-c="' + ci + '" placeholder="' + esc(t("cat")) + '" value="' + esc(c.cat) + '"><button class="d s" data-a="delc" data-c="' + ci + '" type="button">✕</button></div>' +
      c.items.map(function (it, ii) {
        return '<div class="item' + (it.on ? "" : " off") + '"><div class="r2"><input data-m="' + ci + '.' + ii + '.n" placeholder="' + esc(t("name")) + '" value="' + esc(it.n) + '"><input data-m="' + ci + '.' + ii + '.p" inputmode="decimal" class="ltr" placeholder="' + esc(t("price")) + '" value="' + esc(it.p) + '"></div>' +
          '<input data-m="' + ci + '.' + ii + '.d" placeholder="' + esc(t("desc")) + '" value="' + esc(it.d) + '">' +
          '<div class="tools"><label class="sw"><input type="checkbox" data-m="' + ci + '.' + ii + '.on"' + (it.on ? " checked" : "") + '> ' + esc(t("avail")) + '</label><span style="flex:1"></span>' +
          '<button class="g s" data-a="up" data-c="' + ci + '" data-i="' + ii + '" type="button">' + t("up") + '</button><button class="g s" data-a="dn" data-c="' + ci + '" data-i="' + ii + '" type="button">' + t("down") + '</button><button class="d s" data-a="deli" data-c="' + ci + '" data-i="' + ii + '" type="button">' + esc(t("del")) + '</button></div></div>';
      }).join("") + '<div class="tools"><button class="g s" data-a="addi" data-c="' + ci + '" type="button">' + esc(t("additem")) + '</button></div>';
  }).join("");
}
document.addEventListener("input", function (e) {
  var el = e.target; dirty = true; say("");
  if (el.dataset.i && !el.dataset.a) { M.info[el.dataset.i] = el.value; }
  else if (el.dataset.h) { var p = el.dataset.h.split("."); M.hours[+p[0]][+p[1]] = el.value; }
  else if (el.dataset.c !== undefined && !el.dataset.a) { M.menu[+el.dataset.c].cat = el.value; }
  else if (el.dataset.m) { var q = el.dataset.m.split("."), it = M.menu[+q[0]].items[+q[1]]; if (q[2] === "on") { it.on = el.checked; el.closest(".item").classList.toggle("off", !it.on); } else it[q[2]] = el.value; }
});
document.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return; var a = b.dataset.a, c = +b.dataset.c, i = +b.dataset.i;
  if (b.id === "lang") { L = L === "ar" ? "fr" : "ar"; try { localStorage.setItem("wl-edit-l", L); } catch (x) {} return applyLang(); }
  if (b.id === "addh") { M.hours.push(["", ""]); dirty = true; return render(); }
  if (b.id === "addc") { M.menu.push({ cat: "", items: [{ n: "", d: "", p: "", on: true }] }); dirty = true; return render(); }
  if (b.id === "save") return save();
  if (b.id === "view") return window.open(location.origin + "/p/" + S + "/", "_blank");
  if (!a) return;
  if (a === "delh") M.hours.splice(i, 1);
  else if (a === "delc") { if (!confirm(t("confirm"))) return; M.menu.splice(c, 1); }
  else if (a === "deli") { if (!confirm(t("confirm"))) return; M.menu[c].items.splice(i, 1); }
  else if (a === "addi") M.menu[c].items.push({ n: "", d: "", p: "", on: true });
  else if (a === "up" && i > 0) { var x = M.menu[c].items; x.splice(i - 1, 0, x.splice(i, 1)[0]); }
  else if (a === "dn") { var y = M.menu[c].items; if (i < y.length - 1) y.splice(i + 1, 0, y.splice(i, 1)[0]); }
  dirty = true; render();
});
function save() {
  for (var ci = 0; ci < M.menu.length; ci++) for (var ii = 0; ii < M.menu[ci].items.length; ii++) { var p = String(M.menu[ci].items[ii].p || "").trim(); if (p && !/^\d+([.,]\d+)?$/.test(p)) { say(t("e_price") + " (" + M.menu[ci].items[ii].n + ")", "bad"); return; } }
  $("save").disabled = true; say(t("saving"));
  fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ a: "save", s: S, k: K, rows: toRows() }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { $("save").disabled = false; if (j.ok) { dirty = false; say(t("saved"), "ok"); } else say(t(j.e === "key" ? "e_key" : "e_net"), "bad"); })
    .catch(function () { $("save").disabled = false; say(t("e_net"), "bad"); });
}
window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
function init() {
  applyLang();
  if (!/^[a-z0-9][a-z0-9-]{1,58}$/.test(S) || K.length < 12 || !API || API.indexOf("__API") === 0) return fail("e_link");
  say(t("loading"));
  $("app").hidden = false;
  fetch(API + (API.indexOf("?") > -1 ? "&" : "?") + "a=load&s=" + encodeURIComponent(S) + "&k=" + encodeURIComponent(K))
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) return fail("e_key"); fromRows(j.rows); $("bar").hidden = false; say(""); render(); })
    .catch(function () { fail("e_net"); });
}
init();
</script>
</body>
</html>
