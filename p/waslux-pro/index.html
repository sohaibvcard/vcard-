body{min-height:100vh;background:var(--bg);color:var(--ivory);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;line-height:1.5;display:flex;justify-content:center;overflow-x:hidden}
.wrap{width:100%;max-width:480px;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.cover{height:200px;background:linear-gradient(135deg,var(--g2),var(--glow)) center/cover;border-radius:0 0 28px 28px;position:relative;overflow:hidden;isolation:isolate}

.lgb{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-end:14px;z-index:3;min-height:34px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.logo{width:112px;height:112px;margin:-56px auto 0;border-radius:50%;border:4px solid var(--bg);background:var(--c1);position:relative;z-index:2;overflow:hidden;display:flex;align-items:center;justify-content:center}

.ini{font-family:Georgia,serif;font-size:36px;font-weight:700;color:var(--accent)}

h1{font-size:30px;font-weight:800;line-height:1.2}
.tag{margin-top:10px;display:inline-block;padding:5px 14px;border-radius:999px;background:var(--c1);border:1px solid var(--line);color:var(--accent);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.about{margin-top:14px;color:var(--muted);font-size:15px;line-height:1.8}
.sec{padding:0 18px}
.top{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.badge{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--c1);font-size:14px}
.badge i{flex:none;width:10px;height:10px;border-radius:50%;background:#5fd18b;box-shadow:0 0 10px #5fd18b}
.badge.off i{background:#ff7b72;box-shadow:0 0 10px #ff7b72}
.promo{padding:13px 14px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);font-weight:800;font-size:15px;line-height:1.35}
.promo small{display:block;font-weight:600;opacity:.85;font-size:12.5px;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:13px 10px;border-radius:14px;border:1px solid var(--line);color:var(--ivory);text-decoration:none;font-size:15px;background:var(--c1);font-family:inherit;cursor:pointer;width:100%}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic{flex:none;width:32px;height:32px;border-radius:50%;background:var(--tint,rgba(255,255,255,.1));display:inline-grid;place-items:center}
.ic svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic svg .f,.ic svg.f{fill:currentColor;stroke:none}
.ic.b{box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.16)}.ic.b svg{stroke:#fff;color:#fff}.cnl .ic{width:38px;height:38px}.cnl .ic svg{width:21px;height:21px}
.btn.cta .ic{background:rgba(255,255,255,.22)}.btn.cta .ic svg{stroke:currentColor}
.sec>.btn,.sec .grid>*,.sec>.card,.top>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.sec .grid>*:nth-child(2){animation-delay:.05s}.sec .grid>*:nth-child(3){animation-delay:.1s}.sec .grid>*:nth-child(4){animation-delay:.15s}.sec .grid>*:nth-child(5){animation-delay:.2s}.sec .grid>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.cn{margin-top:18px;width:100%;position:relative}
.cnb{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px;border-radius:18px;border:1.5px solid var(--accent);background:var(--tint,transparent);color:var(--ivory);font:inherit;font-size:16.5px;font-weight:800;cursor:pointer}
.cnb::after{content:"";width:8px;height:8px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg) translateY(-2px);transition:transform .25s}
.cn.open .cnb::after{transform:rotate(-135deg) translateY(-2px)}
.cnl{display:none;flex-direction:column;gap:8px;margin-top:10px}.cn.open .cnl{display:flex}
.cnl a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--c1);color:var(--ivory);text-decoration:none;font-size:15.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;animation:pop .38s cubic-bezier(.2,.9,.3,1.2) forwards}
.cnl a span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnl a small{color:var(--muted);font-size:12.5px;direction:ltr}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
.chip .ic{width:24px;height:24px}.chip .ic svg{width:14px;height:14px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn.cta{margin-top:18px;padding:17px 12px;font-size:17px;font-weight:800;border:0;border-radius:18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.btn.pw{border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn.full{grid-column:1/-1}
.st{margin:28px 0 12px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;text-align:start}
html[dir=rtl] .st,html[dir=rtl] .tag{letter-spacing:0}
.card{background:var(--c1);border:1px solid var(--line);border-radius:16px;padding:4px 16px;text-align:start}
.hr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hr:last-child,.row:last-child{border-bottom:0}
.hr span:last-child{color:var(--muted);direction:ltr}
html[dir=rtl] .hr span:last-child{direction:rtl}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ivory);text-decoration:none;font-size:15px;word-break:break-word}
.row svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ltr{direction:ltr;unicode-bidi:embed}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid var(--line);display:block;cursor:pointer;background:var(--c1)}
.gal img:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:16/9}
.social{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}
.chip{display:flex;align-items:center;gap:7px;padding:10px 17px;border:1px solid var(--line);border-radius:999px;background:var(--c1);color:var(--ivory);text-decoration:none;font-size:14.5px;font-weight:600}
.chip svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.credit{margin-top:24px;text-align:center;font-size:12px;direction:ltr}
.credit a{color:var(--muted);text-decoration:none;opacity:.8}
.ba{position:relative;aspect-ratio:16/10;border-radius:18px;overflow:hidden;border:1px solid var(--line);--p:50%;touch-action:pan-y;background:var(--c1)}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .bef{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.ba .lbl{position:absolute;top:10px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:800;letter-spacing:1px}
.ba .l{left:10px}.ba .r{right:10px}
.ba .knob{position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.6)}
.ba .knob::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:800}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cap{color:var(--muted);font-size:13.5px;margin-top:8px}

.ov{position:fixed;inset:0;z-index:80;background:rgba(5,4,3,.72);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sh{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sh h2{font-size:21px}
.sx{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:16px;cursor:pointer}
.sh p{color:var(--muted);font-size:14.5px;margin-bottom:12px}
.lb{font-size:13px;color:var(--muted);margin:12px 0 8px}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.chs button{min-width:46px;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font:inherit;font-size:15px;cursor:pointer}
.chs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border:0;font-weight:800}
.rw{display:flex;gap:10px;margin-top:16px}
.rw .btn{width:auto;margin:0}
.rw .btn:first-child{flex:0 0 34%}
.rw .btn.cta{flex:1;padding:14px 10px;font-size:16px}

.fld.code{font-size:20px;letter-spacing:6px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;background:var(--c1);border:1px solid var(--accent);padding:11px 16px;border-radius:14px;font-size:14.5px;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* menu plein écran */
.fov{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.fh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.fh h2{font-size:20px}
.fx{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:18px;cursor:pointer;flex:none}
.fs{padding:0 16px 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border:0;font-weight:700}
.fb{flex:1;overflow-y:auto;padding:0 16px 30px}
.fb section{margin-bottom:18px}
.fb h3{position:sticky;top:0;z-index:1;background:var(--bg);padding:10px 0;font-size:17px;font-weight:800;color:var(--accent);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.fb h3 span{font-weight:600;color:var(--muted)}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.it[hidden],.fb section[hidden]{display:none}
.it .th{flex:none;width:58px;height:58px;border-radius:12px;object-fit:cover;background:var(--c1)}
.it .in{flex:1;min-width:0}
.it b{display:block;font-size:16px}
.it .d{display:block;margin-top:2px;color:var(--muted);font-size:14px}
.it .p{flex:none;font-weight:800;color:var(--accent);white-space:nowrap;direction:ltr}
.it.so b::after{content:" · " attr(data-so);color:var(--accent);font-size:12px}
.it.so .p,.it.so .q,.it.so .mini{opacity:.4;pointer-events:none}
.q{flex:none;display:flex;align-items:center;gap:8px}
.q button{width:38px;height:38px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:22px;line-height:1;cursor:pointer}
.q button.pl{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);font-weight:800}
.q b{min-width:18px;text-align:center;display:inline}
.mini{flex:none;padding:9px 13px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.cbar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--c1)}
.cbar[hidden]{display:none}
.cbar .ct{flex:1;font-size:13px;color:var(--muted)}.cbar .ct b{display:block;color:var(--ivory);font-size:17px}
.cbar a{flex:none;padding:13px 16px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);font-weight:800;text-decoration:none;font-size:15px}
/* fidélité */
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.dots i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:var(--muted)}
.dots i.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:var(--on);font-weight:800}
.lmsg{margin-top:10px;font-size:14px;font-weight:700}.lmsg.ok{color:#2e9e5b}.lmsg.no{color:#d9534f}
.note{margin-top:8px;font-size:12px;color:var(--muted)}
.ab{margin:8px 0;font-size:15px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  if (tel && !loy.st) h += '<div class="lb">' + esc(T.loyPhone) + '</div><input class="fld" id="f-phone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="05 50 12 34 56" value="' + esc(loy.phone) + '">';
  if (!doneToday || ready) h += '<div class="lb">' + esc(T.loyCode) + '</div><input class="fld code" id="f-code" type="tel" inputmode="numeric" maxlength="4" dir="ltr" placeholder="0000" value="' + esc(loy.code) + '"><div class="rw"><button type="button" class="btn cta" data-a="' + (!tel && ready ? "loyuse" : "loystamp") + '"' + (loy.busy ? " disabled" : "") + '>' + esc(!tel && ready ? T.loyUse : T.loyStamp) + '</button></div>';
  else h += '<div class="lmsg ok">' + esc(T.loyToday) + '</div>';
  if (tel && !loy.st) h += '<div class="note">' + esc(T.loyNote) + '</div>';
  if (tel && loy.st) h += '<div class="rw"><button type="button" class="btn" data-a="loyforget" style="flex:1">' + esc(T.loyChange) + '</button></div>';
  if (loy.msg) h += '<div class="lmsg ' + loy.cls + '" role="status">' + esc(loy.msg) + '</div>';
  return h;
}
function loyDraw() { const b = document.getElementById("loyb"); if (b) b.innerHTML = loyBody(); }
function loyErr(e) { const T = TT(); return e === "today" ? T.loyToday : e === "code" ? T.loyBad : e === "wait" ? T.loyWait : e === "phone" ? T.loyBadPhone : T.loyErr; }
function openLoy() {
  if (!loyOn()) return; loy.msg = ""; loy.cls = "";
  const o = sheet(TT().loyT, '<div id="loyb">' + loyBody() + '</div>');
  o.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b) return; if (b.dataset.a === "loystamp") loyStamp(); else if (b.dataset.a === "loyuse") loyUse(); else if (b.dataset.a === "loyforget") { loy.st = null; loy.phone = ""; loy.msg = ""; loy.code = ""; loySaveP(); loyDraw(); } });
  o.addEventListener("input", e => { const t = e.target; if (t.id === "f-phone") loy.phone = t.value; else if (t.id === "f-code") { t.value = t.value.replace(/\D/g, "").slice(0, 4); loy.code = t.value; } });
  if (loyTel() && loy.phone && !loy.st && loyPhoneOk(loy.phone)) loyStatus();
}
function loyStatus() { const p = loyPhoneOk(loy.phone); if (!p) return; loy.phone = p; loyPost({ a: "fstat", phone: p }).then(j => { if (j && j.ok) { loy.st = j; loySaveP(); } else { loy.msg = loyErr(j && j.e); loy.cls = "no"; } loyDraw(); }).catch(() => { loy.msg = TT().loyErr; loy.cls = "no"; loyDraw(); }); }
function loyDone(j, okf) { loy.busy = false; if (j && j.ok) okf(j); else { if (j && j.stamps != null && loyTel()) loy.st = Object.assign({}, loy.st, j); loy.msg = loyErr(j && j.e); loy.cls = "no"; } loyDraw(); }
function loyFail() { loy.busy = false; loy.msg = TT().loyErr; loy.cls = "no"; loyDraw(); }
function loyStamp() {
  const T = TT(), c = String(loy.code || "").replace(/\D/g, ""); if (c.length !== 4) { loy.msg = T.loyBad; loy.cls = "no"; return loyDraw(); }
  if (loyTel()) {
    const pi = document.getElementById("f-phone"); if (pi) loy.phone = pi.value; const p = loyPhoneOk(loy.phone); if (!p) { loy.msg = T.loyBadPhone; loy.cls = "no"; return loyDraw(); }
    loy.phone = p; loy.busy = true; loy.msg = ""; loyDraw();
    loyPost({ a: "fstamp", phone: p, code: c, consent: true }).then(j => { loySaveP(); loyDone(j, j => { loy.st = j; loy.msg = T.loyOk; loy.cls = "ok"; loy.code = ""; }); }).catch(loyFail);
  } else {
    if (loyC.last === dayStr()) { loy.msg = T.loyToday; loy.cls = "no"; return loyDraw(); }
    loy.busy = true; loy.msg = ""; loyDraw();
    loyPost({ a: "fcheck", code: c }).then(j => loyDone(j, () => { loyC.stamps++; loyC.last = dayStr(); loySaveC(); loy.msg = T.loyOk; loy.cls = "ok"; loy.code = ""; })).catch(loyFail);
  }
}
function loyUse() {
  const T = TT(), c = String(loy.code || "").replace(/\D/g, ""); if (c.length !== 4) { loy.msg = T.loyBad; loy.cls = "no"; return loyDraw(); }
  loy.busy = true; loy.msg = ""; loyDraw();
  loyPost({ a: "fcheck", code: c }).then(j => loyDone(j, () => { loyC.stamps = Math.max(0, loyC.stamps - SHOP.loy.n); loySaveC(); loy.msg = T.loyUsed; loy.cls = "ok"; loy.code = ""; })).catch(loyFail);
}
function loyBoot() {
  if (!pendingC || !loyOn()) return;
  const c = pendingC; pendingC = ""; try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
  openLoy(); loy.code = c; loyDraw();
  if (!loyTel() ? loyC.last !== dayStr() : !!loyPhoneOk(loy.phone)) setTimeout(loyStamp, 250);
}

render();
</script>
