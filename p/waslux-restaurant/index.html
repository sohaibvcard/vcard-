<title>Menu</title>
<style>
:root{--bg:#0d0d0d;--glow:#2a1214;--c1:#1a1a1a;--c2:#131313;--ivory:#f7f2ea;--muted:#b8b0a6;--accent:#e0262f;--g1:#ff5a52;--g2:#c4121f;--on:#fff;--line:rgba(255,255,255,.12);--ok:#3ec97a;--bad:#e5534b}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ivory);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.w{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .w{display:flex;align-items:center;gap:12px;height:66px}
.lg{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--c1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent)}
.nm{min-width:0;flex:1}
.nm b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--bad);display:block}
.st.on i{background:var(--ok)}
.lb{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--c1);font-size:13px;font-weight:700}
/* cover */
.cv{margin-top:14px;height:150px;border-radius:20px;background:linear-gradient(135deg,var(--glow),var(--c2)) center/cover;position:relative;overflow:hidden;isolation:isolate}
.cv::after{content:"";position:absolute;inset:-1px;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.05) 70%)}
.cv div{position:absolute;inset:auto 16px 12px;z-index:1}
.cv h1{font-size:22px;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.cv p{font-size:13px;opacity:.9;color:#fff}
/* search + cats */
.sr{margin-top:12px;position:relative}
.sr input{width:100%;height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--c1);outline:none}
.sr input:focus{border-color:var(--accent)}
.cats{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-top:12px}
.cats .row{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cats .row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--c1);font-size:14px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border-color:transparent;font-weight:700}

.sec h2{font-size:20px;margin-bottom:10px}
.it{display:flex;gap:12px;padding:14px;margin-bottom:10px;background:var(--c1);border:1px solid var(--line);border-radius:18px;align-items:center}

.it h3{font-size:16px;line-height:1.3}

.md{flex:none;position:relative;width:96px;display:flex;flex-direction:column;align-items:center}
.md.im{padding-bottom:16px}

.md.im .ctl{position:absolute;bottom:0}
.ctl{display:flex;align-items:center;justify-content:center}
.add{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.add svg,.qb svg{width:20px;height:20px}
.stp{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--accent);border-radius:999px;height:36px;box-shadow:0 4px 12px rgba(0,0,0,.35);direction:ltr}
.qb{width:34px;height:34px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.stp b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.dl{margin-top:14px}.dh{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}.it.dly{border-color:var(--accent);background:linear-gradient(135deg,var(--c1),var(--glow))}

.fc[hidden]{display:none}
.fc{justify-content:center}#fc2{display:none}
.gt{margin:12px 0 0;padding:11px 14px;border-radius:14px;border:1px dashed var(--accent);background:var(--c1);font-size:14px;line-height:1.5;color:var(--ivory)}.gt.on{border-style:solid;border-color:var(--ok);color:var(--ok);font-weight:700}

.lyb{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:11px 14px;border-radius:14px;border:1px dashed var(--accent);background:var(--c1);color:var(--ivory);font-weight:700;font-size:14px;text-align:start}
.lyb svg{flex:none;width:20px;height:20px;color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.dots i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:var(--muted)}
.dots i.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:var(--on);font-weight:800}
.lmsg{margin-top:10px;font-size:14px;font-weight:700}.lmsg.ok{color:#2e9e5b}.lmsg.no{color:#d9534f}
.lcb{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--muted)}.lcb input{margin-top:3px;width:18px;height:18px;flex:none}body.hasfc{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.chs.tb .ch{min-width:46px;text-align:center}.fx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-radius:12px;background:var(--c1);border:1px solid var(--line);font-weight:700}
.lnk2{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.ack{margin-top:14px;padding:14px;border-radius:14px;background:var(--c1);border:1px solid var(--accent);line-height:1.6}
.none{padding:30px 0;text-align:center;color:var(--muted)}
.cr{padding:26px 0 8px;text-align:center;color:var(--muted);font-size:12px}.cr a{color:inherit}
/* bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{position:relative;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;min-height:58px}
.tab svg{width:24px;height:24px}

.bd{position:absolute;top:4px;inset-inline-start:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));position:relative}
@media(min-width:720px){.ov{align-items:center}.sh{border-radius:24px}}
.sh h2{font-size:22px;padding-inline-end:44px;margin-bottom:12px}
.sx{position:absolute;top:14px;inset-inline-end:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--c1)}
.sh p.in{color:var(--muted);font-size:14px;margin-bottom:12px}
.lbl{font-size:13px;color:var(--muted);margin:14px 0 6px}
.chs{display:flex;gap:8px;flex-wrap:wrap}
.ch{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--c1);font-size:14px}
.ch.on{background:rgba(255,255,255,.08);border-color:var(--accent);color:var(--accent);font-weight:700}
.fld{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--c1);outline:none;font-size:16px}
.fld:focus{border-color:var(--accent)}
textarea.fld{min-height:64px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--c1);text-decoration:none;color:var(--ivory);font-weight:700;margin-top:10px}
.btn svg{width:20px;height:20px;flex:none}
.btn.cta{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln .tx{flex:1;min-width:0}.ln .tx small{display:block;color:var(--muted);font-size:12px}
.ln .pr{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-size:18px;font-weight:800}
.tt span:last-child{color:var(--accent)}
.hint{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;margin-top:12px;display:block;margin-inline:auto}
.hr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.hr.today{color:var(--accent);font-weight:800}
.ab{color:var(--muted);font-size:15px;margin-bottom:6px}
/* contact popover */
.pop{position:fixed;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:stretch;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(260px,calc(100vw - 24px))}
.pi{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--c1);border:1px solid var(--line);text-decoration:none;color:var(--ivory);font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .22s ease both;width:100%}
.pi i{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg);border:1px solid var(--line);color:var(--accent)}
.pi i svg{width:20px;height:20px}
.pi.ig i{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);border:0;color:#fff}
.pi.fb i{background:#1877f2;border:0;color:#fff}
.pi.tk i{background:#000;border:1px solid #fff;color:#fff}
.pi.wa i{background:#25d366;border:0;color:#fff}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ivory);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
/* ================= قسم البيانات — عدّل هذا القسم فقط ================= */
const SHOP = {
  lang: "fr",
  langs: ["fr","ar"],
  msgLang: "fr",
  theme: "fire",
  colors: {"bg":"#133b61","glow":"#344e5b","c1":"#24496c","c2":"#1a4166","ivory":"#f7f2ea","muted":"#b8b0a6","line":"rgba(255,255,255,.12)","accent":"#ffc636","g1":"#ffd468","g2":"#cc9e2b","on":"#1a1a1a"},
  countryCode: "213",

  name: "Waslux Restaurant",
  tagline: "Cuisine du terroir",
  about: "",

  logo: "logo-wasluxrestaurant.jpg",
  logoFit: "cover",
  cover: "cover-wasluxrestaurant.jpg",
  currency: "DA",
  menu: [

  ],

  features: {"cart":true,"waiter":true,"contact":true,"more":true},
  order: { whatsapp: "", prefix: "", modes: ["dinein","takeaway","delivery"], note: "", gate: "", hours: 4 },

  website: "https://waslux.com",
  social: [{"name":"Instagram","url":"https://www.instagram.com/waslux.waslux"},{"name":"Facebook","url":"https://www.facebook.com/share/1KoMmwqa5d/"}],
  sheetCsv: "https://script.google.com/macros/s/AKfycbwAtJKTzuqkcJ6RaJ3IGknOcxp69G40peuWyikTIbaKiIBuGTVUpI_yi4yC5dMq8zg/exec?a=csv&s=waslux-restaurant",
  credit: { text: "Powered by Waslux", url: "https://waslux.com" }
};
/* ===== نهاية قسم البيانات ===== */

/* ===== Google Sheet (facultatif) : si sheetCsv est rempli, le menu, les horaires et les infos viennent du tableau ===== */
(function () {
  if (!SHOP.sheetCsv) return;
  function parse(t) {
    var r = [], row = [], f = "", q = false, i = 0, c; t = t.replace(/^﻿/, "");
    for (; i < t.length; i++) { c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); r.push(row); row = []; f = ""; }
      else f += c; }
    if (f !== "" || row.length) { row.push(f); r.push(row); }
    return r;
  }
  function apply(tx) {
    var rows = parse(tx).slice(1), menu = [], idx = {}, hours = [], stf = [], hls = [], info = {}, has = Object.prototype.hasOwnProperty;
    rows.forEach(function (r) {
      var ty = (r[0] || "").trim().toLowerCase(), a = (r[1] || "").trim(), b = (r[2] || "").trim(), c = (r[3] || "").trim(), p = (r[4] || "").trim(), d = (r[5] || "").trim().toLowerCase(), im = (r[6] || "").trim();
      if (ty === "menu") {
        if (!a || !b || /^(non|no|0|false|nd|epuise|épuisé|نفد)$/.test(d)) return;
        if (!has.call(idx, a)) { idx[a] = menu.length; menu.push({ cat: a, items: [] }); }
        menu[idx[a]].items.push([b, c, p === "" ? "" : (isNaN(+p) ? p : +p), im]);
      } else if (ty === "daily") { if (a && c !== "") SHOP.daily = { name: a, desc: b, price: isNaN(+c) ? c : +c, until: p, img: im }; }
      else if (ty === "staff") { if (a) stf.push({ name: a, whatsapp: b, g: /^(f|femme|serveuse|نادلة|أنثى|انثى)$/i.test(p) ? "f" : "m", active: !/^(non|no|0|false|off|مغلق|لا)$/.test(c.toLowerCase()) }); }
      else if (ty === "hall") { if (a) hls.push({ name: a, tables: b, staff: c }); }
      else if (ty === "hours") { if (a) hours.push([a, b]); }
      else if (ty === "info") { if (a) info[a] = b; }
    });
    if (menu.length) SHOP.menu = menu;
    if (hours.length) SHOP.hours = hours;
    if (stf.length) SHOP.waiter.staff = stf;
    if (hls.length) SHOP.waiter.halls = hls;
    if (info.loyOn === "oui") SHOP.loy = { on: true, n: Math.min(30, Math.max(3, parseInt(info.loyN, 10) || 8)), gift: info.loyGift || "", mode: info.loyMode === "tel" ? "tel" : "code" };
    var ov = {}; if (/^#[0-9a-f]{6}$/i.test(info.accent || "")) ov.accent = info.accent; if (/^#[0-9a-f]{6}$/i.test(info.bg || "")) ov.bg = info.bg; if (/^#[0-9a-f]{6}$/i.test(info.accent2 || "")) ov.accent2 = info.accent2; if (ov.accent || ov.bg || ov.accent2) SHOP.colorOver = ov;
    ["phone", "phone2", "whatsapp", "address", "about", "tagline", "mapLink", "reviewLink", "email", "website"].forEach(function (k) { if (has.call(info, k) && info[k] !== "") SHOP[k] = info[k]; });
  }
  var K = "wl-sheet:" + SHOP.sheetCsv, cached = null;
  try { cached = localStorage.getItem(K); } catch (e) {}
  if (cached) { try { apply(cached); } catch (e) {} }
  try {
    fetch(SHOP.sheetCsv + (SHOP.sheetCsv.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (tx) {
        if (!tx || tx.length < 15 || /<html/i.test(tx) || tx === cached) return;
        try { localStorage.setItem(K, tx); } catch (e) {}
        try { var h = tx.length + ":" + tx.split("").reduce(function (x, c) { return (x * 31 + c.charCodeAt(0)) | 0; }, 7); if (sessionStorage.getItem("wl-r") !== h) { sessionStorage.setItem("wl-r", h); location.reload(); } } catch (e) {}
      }).catch(function () {});
  } catch (e) {}
})();

const TH = {

  rose:  { bg:"#151315", glow:"#2b2126", c1:"#262327", c2:"#1d1b1e", ivory:"#f6ecee", muted:"#b3a8ac", accent:"#e08fa6", g1:"#f2b3c4", g2:"#d1708b", on:"#2a0f18" },
  blue:  { bg:"#0a1118", glow:"#12202e", c1:"#14202b", c2:"#0f1923", ivory:"#e9f1f7", muted:"#9fb2c1", accent:"#5cb3d6", g1:"#8fd3ec", g2:"#3a8fb3", on:"#06202c" },
  green: { bg:"#0c110e", glow:"#15231a", c1:"#16201a", c2:"#101813", ivory:"#eef3ea", muted:"#a3b2a5", accent:"#7bb88a", g1:"#a6d9b0", g2:"#4f9a62", on:"#08210f" }
};

  const parts = l.split(/\s*[–—\-→]\s*|\s+(?:à|au|الى|إلى)\s+/).map(s => s.trim()).filter(Boolean);
  const idx = parts.map(dayIdx).filter(i => i > -1);
  if (!idx.length) return all;
  if (parts.length === 2 && idx.length === 2) { const out = []; let i = idx[0]; for (let k = 0; k < 8; k++) { out.push(i); if (i === idx[1]) break; i = (i + 1) % 7; } return out; }

}

const loyTel = () => !!(SHOP.loy && SHOP.loy.mode === "tel");
const loy = { phone: "", st: null, msg: "", cls: "", busy: false, code: "" };
const dayStr = () => { const d = new Date(), z = x => ("0" + x).slice(-2); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); };
let loyC = { stamps: 0, last: "" };
try { const q = JSON.parse(localStorage.getItem("wl-fid") || "{}"); if (q && typeof q.p === "string") loy.phone = q.p; } catch (e) {}
try { const q = JSON.parse(localStorage.getItem("wl-fidc:" + (LK() ? LK().s : "")) || "{}"); if (q && +q.stamps >= 0) loyC = { stamps: +q.stamps || 0, last: String(q.last || "") }; } catch (e) {}
let pendingC = ""; try { const m = /[?&]c=(\d{4})(&|$)/.exec(location.search); if (m) pendingC = m[1]; } catch (e) {}
function loyPhoneOk(p) { p = String(p || "").replace(/[\s.\-()]/g, "").replace(/^(\+|00)213/, "0"); if (/^213[567]\d{8}$/.test(p)) p = "0" + p.slice(3); return /^0[567]\d{8}$/.test(p) ? p : ""; }
function loyPost(b) { const k = LK(); return fetch(k.api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ s: k.s }, b)) }).then(r => r.json()); }
function loySaveP() { try { localStorage.setItem("wl-fid", JSON.stringify({ p: loy.phone })); } catch (e) {} }
function loySaveC() { try { localStorage.setItem("wl-fidc:" + LK().s, JSON.stringify(loyC)); } catch (e) {} }
function loyBody() {
  const n = SHOP.loy.n, gift = SHOP.loy.gift || "", tel = loyTel();
  const stamps = tel ? (loy.st ? loy.st.stamps : 0) : loyC.stamps, ready = stamps >= n, doneToday = !tel && loyC.last === dayStr();
  let h = "";
  if (!tel || loy.st) {
    const show = Math.min(n, stamps);
    if (tel) h += '<div class="ab" dir="ltr" style="margin-bottom:0">' + esc(loy.phone) + '</div>';
    h += '<div class="dots" dir="ltr">' + Array.from({ length: n }, (_, i) => '<i class="' + (i < show ? "on" : "") + '">' + (i + 1) + '</i>').join("") + '</div>' +
      '<div class="ab"><b>' + esc(Math.min(stamps, n)) + ' / ' + esc(n) + '</b> ' + esc(T.loyVis) + (gift ? ' · ' + esc(T.loyGift) + ' : ' + esc(gift) : "") + '</div>';
    if (ready) h += '<div class="lmsg ok">' + esc(T.loyReady) + '</div>';
  }
  if (tel && !loy.st) h += '<div class="lbl">' + esc(T.loyPhone) + '</div><input class="fld" id="f-phone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="05 50 12 34 56" value="' + esc(loy.phone) + '">';
  if (!doneToday || ready) {
    h += '<div class="lbl">' + esc(T.loyCode) + '</div><input class="fld" id="f-code" type="tel" inputmode="numeric" maxlength="4" dir="ltr" placeholder="0000" value="' + esc(loy.code) + '">' +
      '<button type="button" class="btn cta" data-a="' + (!tel && ready ? "loyuse" : "loystamp") + '"' + (loy.busy ? " disabled" : "") + '>' + esc(!tel && ready ? T.loyUse : T.loyStamp) + '</button>';
  } else h += '<div class="lmsg ok">' + esc(T.loyToday) + '</div>';
  if (tel && !loy.st) h += '<div class="hint" style="margin-top:8px;font-size:12px;color:var(--muted)">' + esc(T.loyNote) + '</div>';
  if (tel && loy.st) h += '<button type="button" class="btn" data-a="loyforget">' + esc(T.loyChange) + '</button>';
  if (loy.msg) h += '<div class="lmsg ' + loy.cls + '" role="status">' + esc(loy.msg) + '</div>';
  return h;
}
function loyDraw() { const b = document.getElementById("loyb"); if (b) b.innerHTML = loyBody(); }
function loyErr(e) { return e === "today" ? T.loyToday : e === "code" ? T.loyBad : e === "wait" ? T.loyWait : e === "phone" ? T.loyBadPhone : T.loyErr; }
function openLoy() { if (!loyOn()) return; loy.msg = ""; loy.cls = ""; sheet(T.loyT, '<div id="loyb">' + loyBody() + '</div>'); if (loyTel() && loy.phone && !loy.st && loyPhoneOk(loy.phone)) loyStatus(); }
function loyStatus() {
  const p = loyPhoneOk(loy.phone); if (!p) return;
  loy.phone = p; loyPost({ a: "fstat", phone: p }).then(j => { if (j && j.ok) { loy.st = j; loySaveP(); } else { loy.msg = loyErr(j && j.e); loy.cls = "no"; } loyDraw(); }).catch(() => { loy.msg = T.loyErr; loy.cls = "no"; loyDraw(); });
}
function loyStamp(auto) {
  const c = String(loy.code || "").replace(/\D/g, ""); if (c.length !== 4) { loy.msg = T.loyBad; loy.cls = "no"; return loyDraw(); }
  if (loyTel()) {
    const pi = document.getElementById("f-phone"); if (pi) loy.phone = pi.value;
    const p = loyPhoneOk(loy.phone); if (!p) { loy.msg = T.loyBadPhone; loy.cls = "no"; return loyDraw(); }
    loy.phone = p; loy.busy = true; loy.msg = ""; loyDraw();
    loyPost({ a: "fstamp", phone: p, code: c, consent: true }).then(j => {
      loy.busy = false;
      if (j && j.ok) { loy.st = j; loy.msg = T.loyOk; loy.cls = "ok"; loy.code = ""; loySaveP(); }
      else { if (j && j.stamps != null) loy.st = Object.assign({}, loy.st, j); loy.msg = loyErr(j && j.e); loy.cls = "no"; loySaveP(); }
      loyDraw();
    }).catch(() => { loy.busy = false; loy.msg = T.loyErr; loy.cls = "no"; loyDraw(); });
  } else {
    if (loyC.last === dayStr()) { loy.msg = T.loyToday; loy.cls = "no"; return loyDraw(); }
    loy.busy = true; loy.msg = ""; loyDraw();
    loyPost({ a: "fcheck", code: c }).then(j => {
      loy.busy = false;
      if (j && j.ok) { loyC.stamps++; loyC.last = dayStr(); loySaveC(); loy.msg = T.loyOk; loy.cls = "ok"; loy.code = ""; }
      else { loy.msg = loyErr(j && j.e); loy.cls = "no"; }
      loyDraw();
    }).catch(() => { loy.busy = false; loy.msg = T.loyErr; loy.cls = "no"; loyDraw(); });
  }
}
function loyUse() {
  const c = String(loy.code || "").replace(/\D/g, ""); if (c.length !== 4) { loy.msg = T.loyBad; loy.cls = "no"; return loyDraw(); }
  loy.busy = true; loy.msg = ""; loyDraw();
  loyPost({ a: "fcheck", code: c }).then(j => {
    loy.busy = false;
    if (j && j.ok) { loyC.stamps = Math.max(0, loyC.stamps - SHOP.loy.n); loySaveC(); loy.msg = T.loyUsed; loy.cls = "ok"; loy.code = ""; }
    else { loy.msg = loyErr(j && j.e); loy.cls = "no"; }
    loyDraw();
  }).catch(() => { loy.busy = false; loy.msg = T.loyErr; loy.cls = "no"; loyDraw(); });
}
function loyBoot() {
  if (!pendingC || !loyOn()) return;
  const c = pendingC; pendingC = ""; try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
  openLoy(); loy.code = c; loyDraw();
  if (!loyTel() ? loyC.last !== dayStr() : !!loyPhoneOk(loy.phone)) setTimeout(() => loyStamp(true), 250);
}
function openMore() {
  setTab("more");
  const today = new Date().getDay();
  let h = "";
  if (SHOP.about) h += '<div class="ab">' + esc(SHOP.about) + '</div>';
  if ((SHOP.hours || []).length) h += '<div class="lbl">' + esc(T.hours) + '</div>' + SHOP.hours.map(x => '<div class="hr' + (daysOf(x[0]).indexOf(today) > -1 ? " today" : "") + '"><span>' + esc(x[0]) + '</span><span dir="ltr">' + esc(x[1]) + '</span></div>').join("");
  if (SHOP.address) h += '<div class="lbl">' + esc(T.info) + '</div><div class="ab">' + esc(SHOP.address) + '</div>';
  if (safeUrl(SHOP.mapLink)) h += '<a class="btn" href="' + esc(SHOP.mapLink) + '" target="_blank" rel="noopener">' + IC.pin + esc(T.map) + '</a>';
  if (safeUrl(SHOP.reviewLink)) h += '<a class="btn" href="' + esc(SHOP.reviewLink) + '" target="_blank" rel="noopener">' + IC.star + esc(T.review) + '</a>';
  if (safeUrl(SHOP.website)) h += '<a class="btn" href="' + esc(SHOP.website) + '" target="_blank" rel="noopener">' + IC.link + esc(T.site) + '</a>';
  sheet(SHOP.name, h || '<p class="in">—</p>');
}

/* ---------- بحث + تمرير ---------- */
function spy() {
  const row = document.getElementById("cats"); if (!row || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { const i = e.target.dataset.ci; row.querySelectorAll(".chip").forEach(c => { const on = c.dataset.i === i; c.classList.toggle("on", on); if (on) { const l = c.offsetLeft - row.clientWidth / 2 + c.offsetWidth / 2; row.scrollTo({ left: LANG === "ar" ? l : l, behavior: "smooth" }); } }); } }); }, { rootMargin: "-130px 0px -70% 0px" });
  document.querySelectorAll(".sec").forEach(s => io.observe(s));
}
function filter(q) {
  q = q.trim().toLowerCase(); let any = false;
  document.querySelectorAll(".sec").forEach(s => { let n = 0; s.querySelectorAll(".it").forEach(it => { const ok = !q || it.dataset.n.indexOf(q) > -1; it.hidden = !ok; if (ok) n++; }); s.hidden = !n; if (n) any = true; });
  const e = document.getElementById("none"); if (e) e.hidden = any || !q;
}

/* ---------- الأحداث ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (popEl && !(t && t.dataset.a === "tab") && !e.target.closest(".pop")) { closePop(); setTab(sheetEl ? "" : "menu"); }
  if (!t) return;
  const a = t.dataset.a, o = ITEMS[+t.dataset.id];
  if (a === "inc" || a === "cinc") { cart[o.key] = (cart[o.key] || 0) + 1; saveCart(); refreshCtl(o); if (a === "cinc") reCart(); }
  else if (a === "dec" || a === "cdec") { cart[o.key] = (cart[o.key] || 0) - 1; if (cart[o.key] <= 0) delete cart[o.key]; saveCart(); refreshCtl(o); if (a === "cdec") reCart(); }
  else if (a === "cat") { const s = document.getElementById("c" + t.dataset.i); if (s) window.scrollTo({ top: s.getBoundingClientRect().top + scrollY - 118, behavior: "smooth" }); }
  else if (a === "tab") { const k = t.dataset.t; if (k === "menu") { closeSheet(); closePop(); setTab("menu"); window.scrollTo({ top: 0, behavior: "smooth" }); } else if (k === "cart") openCart(); else if (k === "waiter") openWaiter(); else if (k === "contact") openContact(t); else if (k === "more") openMore(); }
  else if (a === "close") { closeSheet(); setTab("menu"); }
  else if (a === "loy") openLoy();
  else if (a === "loystamp") loyStamp();
  else if (a === "loyuse") loyUse();
  else if (a === "loyforget") { loy.st = null; loy.phone = ""; loy.msg = ""; loy.code = ""; loySaveP(); loyDraw(); }
  else if (a === "lang") { LANG = LANG === "ar" ? (langs.find(l => l !== "ar") || "fr") : "ar"; ls.set("wl-r-lang", LANG); closeSheet(); closePop(); render(); }
  else if (a === "mode") { form.mode = t.dataset.m; reCart(); }
  else if (a === "clear") { cart = {}; saveCart(); document.querySelectorAll(".ctl").forEach(c => { const x = ITEMS[+c.dataset.c]; if (x) c.innerHTML = ctl(x); }); badge(); reCart(); }
  else if (a === "hall") { wait.hall = t.dataset.h; const h = hallObj(); if (h && wait.table && tableNums(h.tables).indexOf(+wait.table) < 0) wait.table = ""; refreshSheet(); }
  else if (a === "tbl") { wait.table = t.dataset.n; refreshSheet(); }
  else if (a === "unlock") { urlTable = ""; urlHall = ""; wait.table = ""; wait.hall = ""; sess.del("wl-r-loc"); if (GATE) ls.set(SK, JSON.stringify({ t: "", h: "", x: sesExp })); refreshSheet(); }
  else if (a === "reopen") { reCart(); }
  else if (a === "why") { wait.why = +t.dataset.i; wait.ack = null; const b = document.getElementById("wb"); if (b) { b.innerHTML = waiterHtml(); syncWait(); } }
  else if (a === "vcard") { vcard(); closePop(); setTab("menu"); }
});
document.addEventListener("click", e => {
  const g = e.target.closest("#go");
  if (g) { if (g.dataset.bad) { e.preventDefault(); const h = document.getElementById("hint"); if (h) h.textContent = g.dataset.bad; } else { const cb = document.getElementById("cb"); setTimeout(() => { const c2 = document.getElementById("cb"); if (c2) c2.innerHTML = '<div class="ack">' + esc(ACK[LANG].order) + '</div>' + (loyOn() ? '<button type="button" class="lyb" data-a="loy">' + IC.star + '<span>' + esc(T.loyAfter) + '</span></button>' : "") + '<button type="button" class="btn cta" data-a="close">' + esc(T.back) + '</button><button type="button" class="lnk" data-a="reopen">' + esc(T.editOrder) + '</button>'; }, 600); } return; }
  const w2 = e.target.closest(".wgo2");
  if (w2 && !wait.table) { e.preventDefault(); const h = document.getElementById("whint"); if (h) h.textContent = T.needTable; return; }
  const w = e.target.closest("#wgo");
  if (w) { if (w.getAttribute("aria-disabled") === "true") { e.preventDefault(); return; } if (!wait.table) { e.preventDefault(); const h = document.getElementById("whint"); if (h) h.textContent = T.needTable; return; } const tg0 = targets()[0], kind = ackKind(); wait.ack = { t: ACK[LANG][kind](tg0), review: kind === "bill" }; wait.until = Date.now() + 120000; ls.set("wl-r-wait", String(wait.until)); setTimeout(() => { const b = document.getElementById("wb"); if (b) { b.innerHTML = waiterHtml(); syncWait(); } }, 80); }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "q") filter(e.target.value);
  else if (id === "f-phone") loy.phone = e.target.value;
  else if (id === "f-code") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); loy.code = e.target.value; }
  else if (id === "f-table") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3); wait.table = e.target.value; syncGo(); }
  else if (id === "f-addr") { form.addr = e.target.value; syncGo(); }
  else if (id === "f-name") { form.name = e.target.value; syncGo(); }
  else if (id === "f-note") { form.note = e.target.value; syncGo(); }
  else if (id === "w-table") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3); wait.table = e.target.value; const b = document.getElementById("wb"); if (b) { b.innerHTML = waiterHtml(); syncWait(); const w = document.getElementById("w-table"); if (w) { w.focus(); try { w.setSelectionRange(w.value.length, w.value.length); } catch (x) {} } } }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closePop(); setTab("menu"); } });
setInterval(() => { if (document.getElementById("wgo")) syncWait(); }, 1000);
render();
</script>
</body>
