<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<!-- WASLUX TEMPLATE: Business Profile v6 | تعديل قسم SHOP فقط | لا تغيّر بقية الكود -->

<title>Business Profile</title>
<style>
:root{--bg:#120e0c;--glow:#2a1a10;--c1:#1c1613;--c2:#15100e;--ivory:#fff3e6;--muted:#c4ad9b;--accent:#ff6b1a;--g1:#ffb703;--g2:#ff6b1a;--on:#1a0d04;--line:rgba(255,107,26,.3)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--ivory);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.cover{height:200px;background:linear-gradient(135deg,var(--g2),var(--glow));background-size:cover;background-position:center;border-radius:0 0 28px 28px;position:relative}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.logo{width:112px;height:112px;margin:-56px auto 0;border-radius:50%;border:4px solid var(--bg);background:var(--c1);position:relative;z-index:2;overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:contain;padding:8px}
.ini{font-family:Georgia,serif;font-size:36px;font-weight:700;color:var(--accent)}
.head{text-align:center;padding:14px 20px 0}
h1{font-size:30px;font-weight:800;letter-spacing:.3px;line-height:1.2}
.tag{margin-top:10px;display:inline-block;padding:5px 14px;border-radius:999px;background:var(--c1);border:1px solid var(--line);color:var(--accent);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.about{margin-top:14px;color:var(--muted);font-size:15px;line-height:1.8}
.sec{padding:0 18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:14px;border:1px solid var(--line);color:var(--ivory);text-decoration:none;font-size:15px;background:var(--c1);font-family:inherit;cursor:pointer;width:100%}
.btn svg,.row svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.cta{margin-top:22px;padding:18px 12px;font-size:17px;font-weight:800;border:0;border-radius:18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.btn.cta svg{width:22px;height:22px}
.btn:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn.full{grid-column:1/-1}
.st{margin:30px 0 12px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;text-align:start}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid var(--line);display:block;cursor:pointer;background:var(--c1)}
.gal img:last-child:nth-child(odd){grid-column:1/-1;aspect-ratio:16/9}
.card{background:var(--c1);border:1px solid var(--line);border-radius:16px;padding:4px 16px;text-align:start}
.hr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.hr:last-child,.row:last-child{border-bottom:0}
.hr span:last-child{color:var(--muted);direction:ltr}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ivory);text-decoration:none;font-size:15px;word-break:break-word}
.row svg{color:var(--accent)}
.social{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}
.chip{display:flex;align-items:center;gap:7px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--c1);color:var(--ivory);text-decoration:none;font-size:14px}
.chip svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--c1);border:1px solid var(--line);color:var(--accent);text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.sb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb svg.f{fill:currentColor;stroke:none}
.sb[class*=" b-"]{border:0;color:#fff}
.b-instagram{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)!important}
.b-facebook{background:#1877f2!important}
.b-tiktok{background:#000!important}
.b-tiktok svg{filter:drop-shadow(1.5px 1.5px 0 #fe2c55) drop-shadow(-1.5px -1.5px 0 #25f4ee)}
.b-youtube{background:#ff0000!important}
.b-whatsapp{background:#25d366!important}
.b-snapchat{background:#fffc00!important;color:#111!important}
.b-telegram{background:#2aabee!important}
.b-linkedin{background:#0a66c2!important}
.b-x{background:#000!important}
.sb:active{transform:scale(.94)}
.ltr{direction:ltr;unicode-bidi:embed}
html[dir=rtl] .st,html[dir=rtl] .tag{letter-spacing:0}
html[dir=rtl] .hr span:last-child{direction:rtl}
.credit{margin-top:26px;text-align:center;font-size:12px;direction:ltr}
.credit a{color:var(--muted);text-decoration:none;opacity:.8}
#hs{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
#hs[hidden]{display:none}
#ht{font-size:20px;font-weight:800}
#hx{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:18px;cursor:pointer;flex:none}
body.g{background:radial-gradient(120% 50% at 50% 0%,var(--glow),var(--bg) 65%) no-repeat,var(--bg)}
.g .cover{height:140px;border-radius:0;-webkit-mask-image:linear-gradient(180deg,#000 52%,transparent 100%);mask-image:linear-gradient(180deg,#000 52%,transparent 100%)}
.g .cover::after{display:none}
.g .logo{width:96px;height:96px;margin-top:-64px;border:0;box-shadow:0 0 0 3px var(--g1),0 0 0 7px var(--bg),0 14px 34px rgba(0,0,0,.35)}
.g .head{padding:12px 20px 0}
.g h1{font-size:28px}
.g .tag{margin-top:6px;padding:0;border:0;background:none;font-size:11px;letter-spacing:2.5px}
.g .about{margin-top:8px;font-size:13.5px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:90px;grid-auto-flow:dense;gap:10px;margin-top:16px}
.tile{grid-column:span 2;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:11px 12px;border-radius:22px;border:1px solid var(--line);background:var(--tilev);background:linear-gradient(155deg,color-mix(in srgb,var(--tilev) 80%,#fff 20%),var(--tilev));color:var(--tileText);text-decoration:none;font-family:inherit;text-align:start;cursor:pointer;width:100%;animation:up .5s both;animation-delay:calc(var(--i)*60ms)}
.ti{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.09);background:color-mix(in srgb,var(--g1) 17%,transparent)}
.ti svg{width:18px;height:18px;stroke:var(--g1);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.tl{font-size:13px;font-weight:700;line-height:1.25}
.tile em{font-style:normal;font-size:11px;opacity:.7;direction:ltr;unicode-bidi:embed;text-align:start}
.tile.c2{background:var(--c1);color:var(--ivory)}
.tile.c2 .ti{background:linear-gradient(135deg,var(--g1),var(--g2))}
.tile.c2 .ti svg{stroke:var(--on)}
.tile.big{grid-column:span 4;grid-row:span 2;padding:16px;border:0;background:linear-gradient(145deg,var(--g1),var(--g2));color:var(--on);box-shadow:0 16px 32px rgba(0,0,0,.25)}
.tile.big::before,.tile.big::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.tile.big::before{width:170px;height:170px;inset-inline-end:-50px;bottom:-60px;background:rgba(255,255,255,.2)}
.tile.big::after{width:90px;height:90px;inset-inline-end:34px;top:-34px;border:1px solid rgba(255,255,255,.35)}
.tile.big .ti{width:54px;height:54px;background:rgba(255,255,255,.38);position:relative;z-index:1}
.tile.big .ti svg{width:28px;height:28px;stroke:var(--on)}
.tile.big .tx{position:relative;z-index:1}
.tile.big .tl{font-size:22px;font-weight:800}
.tile.big em{font-size:14px;opacity:.8;font-weight:600}
.tile.big.w{grid-row:span 1;grid-column:span 6;flex-direction:row;align-items:center;padding:12px 16px}
.tile.big.w .ti{width:46px;height:46px}
.tile.s3{grid-column:span 3}
.tile.s6{grid-column:span 6;flex-direction:row;align-items:center;gap:12px}
.tile.tall{grid-row:span 2;justify-content:center;align-items:center;text-align:center;gap:10px}
.tile.tall .tx{align-items:center}
.tile:active{transform:scale(.97)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.tile{animation:none}}
.g .social{margin-top:18px;gap:12px}
.g .credit{margin-top:12px}
#viewer{position:fixed;inset:0;background:rgba(8,6,5,.97);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:64px 12px calc(24px + env(safe-area-inset-bottom))}
#viewer[hidden]{display:none}
#vx{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline-end:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:20px;z-index:51;cursor:pointer}
#vbox img{display:block;width:100%;max-width:720px;margin:0 auto 14px;border-radius:12px}
#mv{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
#mv[hidden]{display:none}
.mvh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
#mt{font-size:20px;font-weight:800}
#mx{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:18px;cursor:pointer;flex:none}
.mvs{padding:0 16px 10px}
#mq{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:16px;font-family:inherit;outline:none}
#mq::placeholder{color:var(--muted)}
.mvtabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mvtabs::-webkit-scrollbar{display:none}
.mvtabs button{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--c1);color:var(--ivory);font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
.mvtabs button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border:0;font-weight:700}
.mvb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.mvb section{margin-bottom:22px}
.mvb h3{position:sticky;top:0;z-index:1;background:var(--bg);padding:10px 0;font-size:17px;font-weight:800;color:var(--accent);display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.mvb h3 span{font-weight:600;color:var(--muted)}
.it{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it[hidden],.mvb section[hidden],.empty[hidden]{display:none}
.in b{display:block;font-size:16px;font-weight:700}
.in span{display:block;margin-top:3px;color:var(--muted);font-size:14px}
html[dir=ltr] .in span{text-align:left}
html[dir=rtl] .in span{text-align:right}
.ip{flex:none;font-weight:800;color:var(--accent);font-size:16px;direction:ltr;white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
</style>
</head>

<script>
/* =====================================================

  address: "",

};
/* ================= نهاية قسم البيانات ================= */

const TH = {
  fire:  { bg:"#120e0c", glow:"#2a1a10", c1:"#1c1613", c2:"#15100e", ivory:"#fff3e6", muted:"#c4ad9b", accent:"#ff6b1a", g1:"#ffb703", g2:"#ff6b1a", on:"#1a0d04" },
  gold:  { bg:"#0b0b0c", glow:"#1f1b11", c1:"#171716", c2:"#101011", ivory:"#f1e9d8", muted:"#a9a293", accent:"#c8a85a", g1:"#e6cf8e", g2:"#b59443", on:"#17130a" },

const TX = {

const T = Object.assign({}, TX[SHOP.lang] || TX.fr, SHOP.labels || {});

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const isWeb = u => /^https?:\/\//i.test(u);
const rgba = (h, a) => { const n = parseInt(h.replace("#", ""), 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; };
const intl = n => {
  let d = String(n || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  else if (d.startsWith("0")) d = SHOP.countryCode + d.slice(1);
  return d;
